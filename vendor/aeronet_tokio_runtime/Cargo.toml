[package]
name = "aeronet_tokio_runtime"
version = "0.21.0"
edition = "2024"
rust-version = "1.95.0"
description = "Platform-agnostic async runtime for `aeronet` IO layers"
repository = "https://github.com/aecsocket/aeronet"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "gamedev", "network"]
categories = ["game-development", "network-programming"]

# Vendored copy of the (unpublished on crates.io) upstream
# `aeronet_tokio_runtime` from github.com/aecsocket/aeronet @ main.

[dependencies]
bevy_ecs = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gloo-timers = { workspace = true, features = ["futures"] }
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true

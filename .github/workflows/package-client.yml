name: Package Regolith client

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create or update with these client assets"
        required: true
        type: string
  push:
    tags:
      - "playtest-*"

permissions:
  # This workflow is never triggered by a pull request. The publish job needs
  # this narrow write grant to create a tag-backed release and upload its assets.
  contents: write

# This workflow is deliberately release-shaped. Do not add a PR trigger: it
# will eventually hold the private-assets credential, and PR code must never
# run with that authority.
jobs:
  package-client:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/playtest-')
    name: package Regolith (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: x86_64-linux, binary: orrery_regolith_client }
          - { os: windows-latest, label: x86_64-windows, binary: orrery_regolith_client.exe }
          - { os: macos-latest, label: aarch64-macos, binary: orrery_regolith_client }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: clients/regolith
    env:
      ORRERY_BUILD_REV: ${{ github.sha }}
      # `.cargo/config.toml` routes rustc through `kache` so agent worktrees
      # share one object cache. A hosted runner has no kache on PATH, and cargo
      # treats a missing wrapper as a hard error, not a fallback:
      #
      #   error: could not execute process `kache .../rustc` (os error 2)
      #
      # `ci.yml` already carries this opt-out at workflow scope; this workflow
      # did not, which is why every matrix leg failed on its first ever run.
      # Unlike `ci.yml` there is no kache-installing job here to put it back.
      RUSTC_WRAPPER: ""
      # A fresh runner has no incremental artifacts to reuse, so they cost
      # build time and buy nothing.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The client takes `bevy` with default features, which pulls bevy_winit
      # and its display/audio stack, so alsa-sys, libudev-sys and wayland-sys
      # probe pkg-config at build-script time. A developer machine usually has
      # these; a hosted runner does not — which is why this workflow built
      # locally and failed on `ubuntu-latest`. `ci.yml` installs the same set
      # for its clippy, test and gates lanes; this workflow needs it for the
      # same reason and did not have it.
      #
      # Linux only: the macOS and Windows runners ship their own display and
      # audio SDKs, and `apt-get` does not exist there.
      # Build deps give headers and the -dev symlinks; the render-smoke step
      # below *runs* the binary, which is a different dependency set. Bevy and
      # winit dlopen the X11/xkb stack, so those libraries never appear in
      # `ldd` and are not pulled in as -dev dependencies either --
      # `libxkbcommon-dev` in particular does not provide
      # `libxkbcommon-x11.so.0`, which winit's X11 backend needs. Building was
      # enough until #562 made this leg launch the client.
      - name: Install Bevy's Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev xvfb mesa-vulkan-drivers \
            libxkbcommon-x11-0 libxcb-xkb1 libx11-xcb1 libxcb-randr0 \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libvulkan1

      - name: Build the standalone Regolith workspace
        # The standalone workspace has its own lockfile. Refuse to resolve a
        # newer dependency while producing a client somebody will be asked to
        # reconcile against a campaign's pinned revision.
        run: cargo build --release --locked

      - name: Stage, identify, and checksum the code-only client
        working-directory: .
        run: |
          set -euo pipefail
          # Every command in this step is silent on success, and `test` and
          # `grep -q` are silent on failure too — so a failure here used to
          # produce a step with no output at all, which cost two blind
          # diagnosis rounds. `must` gives every assertion a voice.
          must() { local why=$1; shift; "$@" || { echo "package: $why" >&2; exit 1; }; }
          mkdir -p stage dist
          artifact="orrery-regolith-${{ matrix.label }}"
          binary="${{ matrix.binary }}"
          # Windows refuses to execute an extensionless file — Explorer asks
          # "how do you want to open this file?" and the player is stuck — so
          # the shipped name must keep the extension the compiler gave the
          # binary. Deriving it from `matrix.binary` rather than hardcoding
          # `.exe` on the Windows leg keeps the two in step. (#768)
          case "$binary" in
            *.*) artifact="$artifact.${binary##*.}" ;;
          esac
          # Both packaging steps name the asset; this is the one place it is
          # decided, so the archive can never disagree with the stage.
          echo "CLIENT_ASSET=$artifact" >> "$GITHUB_ENV"
          cp "clients/regolith/target/release/$binary" "stage/$artifact"
          "stage/$artifact" --build-info > stage/build-info.json
          node -e '
            const fs = require("fs");
            const info = JSON.parse(fs.readFileSync("stage/build-info.json", "utf8"));
            if (info.client_rev !== process.env.GITHUB_SHA) {
              throw new Error(`embedded client_rev ${info.client_rev} is not ${process.env.GITHUB_SHA}`);
            }
            if (!Number.isInteger(info.ruleset_version)) {
              throw new Error("build-info has no integer ruleset_version");
            }
            if (typeof info.admission_url !== "string" || !info.admission_url.startsWith("https://")) {
              throw new Error("build-info has no HTTPS admission_url");
            }
          '
          cp clients/regolith/PLAYTEST.md stage/README.md
          # There are deliberately no private or loose visual assets in this
          # release. If that changes, #347 requires an encrypted/proprietary
          # bundle before the archive can ship.
          must "loose assets in stage/ — #347 requires an encrypted bundle first" test ! -e stage/assets
          (
            cd stage
            if command -v sha256sum >/dev/null; then
              sha256sum "$artifact" > "$artifact.sha256"
            else
              shasum -a 256 "$artifact" > "$artifact.sha256"
            fi
          )
          must "staged binary is missing or empty" test -s "stage/$artifact"
          must "build-info.json is missing or empty" test -s stage/build-info.json
          must "README.md is missing or empty" test -s stage/README.md
          must "checksum file is missing or empty" test -s "stage/$artifact.sha256"
          # The README tells the player which file to open. If it names a file
          # the archive does not contain — as it did while the `.exe` was being
          # renamed away — the player is left guessing. (#768)
          must "README.md does not name $artifact, so the player is left guessing" \
            grep -qF "$artifact" stage/README.md
          # The checksum file is generated after the rename above, so its
          # recorded name is the shipped name and `sha256sum -c` works as the
          # README describes it.
          #
          # Two separators, because the tools disagree and both are correct.
          # GNU `sha256sum` writes `HASH  NAME` in text mode, which is the
          # default on Linux, and `HASH *NAME` in binary mode, which is the
          # default for the `sha256sum` that ships with Git for Windows. macOS
          # uses `shasum -a 256`, which writes two spaces. Asserting on a
          # leading space alone therefore could never pass on Windows — and it
          # never has: this assertion arrived in #776, after the last Windows
          # package succeeded, so its first real run was its first failure.
          # An exact comparison on the recorded filename, not a pattern: the
          # name contains a `.` on Windows and regex-escaping it inside a YAML
          # `run:` block is how this assertion was got wrong twice.
          must "the checksum file does not record the shipped name $artifact" \
            awk -v want="$artifact" '{
            name = $NF
            sub(/^\*/, "", name)
            if (name == want) { found = 1 }
          } END { exit found ? 0 : 1 }' "stage/$artifact.sha256"

      - name: Package Unix client
        if: runner.os != 'Windows'
        working-directory: .
        run: |
          asset="$CLIENT_ASSET"
          archive="dist/orrery-regolith-${{ matrix.label }}.tar.gz"
          tar -C stage -czf "$archive" "$asset" "$asset.sha256" build-info.json README.md
          test -s "$archive"
          # The manifest assertion that used to live here now runs against an
          # *extraction* of this archive, on every platform, in the artifact
          # smoke below. A listing and what lands on disk are two different
          # claims, and only the second is what the volunteer gets. (#774)

      - name: Package Windows client
        if: runner.os == 'Windows'
        working-directory: .
        run: |
          asset="$CLIENT_ASSET"
          archive="dist/orrery-regolith-${{ matrix.label }}.zip"
          # Stated literally, not derived: if the name derivation in the stage
          # step ever loses the extension again, the assertions below would
          # otherwise move along with it and stay green. (#768)
          test "$asset" = "orrery-regolith-${{ matrix.label }}.exe"
          # Zip from inside `stage` so the archive is flat. 7z stores whatever
          # path it is handed, so naming `stage/...` here put an internal build
          # directory in the player's extraction. The tar leg has always used
          # `-C stage`; this is the same thing. (#768)
          (
            cd stage
            7z a -tzip "../$archive" "$asset" "$asset.sha256" build-info.json README.md
          )
          7z t "$archive"
          test -s "$archive"
          # #768's manifest assertion — the four names, flat, no `stage/`
          # prefix — and the clause holding the shipped README to the shipped
          # binary have both moved into the artifact smoke below, which asserts
          # them from an extraction rather than from a listing, and does it on
          # all three platforms instead of only where somebody remembered.
          # (#774)

      # The pipeline verified what it compiled and nothing verified what it
      # shipped. Everything below operates on the archive that is about to be
      # uploaded: it is extracted into a fresh directory, its contents are held
      # to the names PLAYTEST.md puts in front of a volunteer, and the
      # extracted binary is launched from that directory — once where it may
      # write, and once from a copy this runner genuinely cannot write, which
      # is the case that stopped the first Windows volunteer at the door
      # (#766, #772). Nothing here looks at `target/`.
      #
      # This replaces the built-binary render smoke that used to run here: the
      # read-only case below is a rendered launch, so #550's delayed
      # compositor failure is still covered — by the copy that ships.
      - name: Smoke the archive that will be published
        working-directory: .
        run: |
          set -euo pipefail
          archive="dist/orrery-regolith-${{ matrix.label }}."
          if [ "$RUNNER_OS" = Windows ]; then archive="${archive}zip"; else archive="${archive}tar.gz"; fi
          # This runs no `--campaign` join, deliberately: see the block below.
          scripts/package-artifact-smoke.sh \
            --archive "$archive" \
            --label ${{ matrix.label }} \
            --keep-extraction "$RUNNER_TEMP/extracted"

      # ── where the campaign joins went, and what that costs (#1062) ────────
      #
      # Two steps used to live here: a one-client join from the extracted
      # archive on Windows and macOS, and a three-client cohort against the
      # deployed campaign on Linux. Both are now in
      # `.github/workflows/validate-client-release.yml`, which runs them
      # nightly and on manual dispatch, one platform at a time.
      #
      # Why they left. This is a matrix of three jobs running at once, and each
      # leg joined the same live `shakedown` campaign, which has three human
      # seats. Linux's cohort alone took all three, so macOS and Windows failed
      # on join. That is what stopped `playtest-2026-09-04` (196414c) from
      # publishing: Linux green, macOS and Windows red, publish skipped, and
      # nothing red said anything about the artifact. A build must not depend
      # on live, shared, scarce infrastructure; a red release leg must not mean
      # "someone else had the seat".
      #
      # **What this costs, stated rather than discovered.** The comments here
      # used to read: "Windows and macOS have never join-tested the artifact
      # they publish, which is how #769 reached a volunteer." That regression
      # is still covered — by the validation workflow, not by this one — so
      # between publishing a build and validating it there is now a window in
      # which a published archive has not been join-tested on any platform. The
      # nightly closes that window in the steady state. For a release someone
      # intends to hand a tester, close it deliberately: dispatch
      # `validate-client-release.yml` against the release tag, and read its
      # result, before sending the link. The operator note "validating a
      # release, and the window between" in `clients/regolith/PLAYTEST.md` says
      # the same thing to the person handing out the build.
      #
      # Nothing below this line and nothing above it makes a network call to
      # the campaign service. Keep it that way.

      - name: Upload release assets for publication
        uses: actions/upload-artifact@v7
        with:
          name: regolith-${{ matrix.label }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  publish-client:
    name: publish Regolith release assets
    needs: package-client
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Download the three platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: regolith-*
          path: dist
          merge-multiple: true

      # This job deliberately does not check out the repository — it only needs
      # the three archives the matrix uploaded. But `gh` resolves the target
      # repo from the git remote by default, so without a checkout every
      # command died with:
      #
      #   failed to run git: fatal: not a git repository
      #
      # `--repo` names it explicitly, which is cheaper than adding a checkout
      # for the sole purpose of telling `gh` where it already is.
      - name: Create the release if needed and upload its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber

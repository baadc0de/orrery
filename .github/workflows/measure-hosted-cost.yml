# THROWAWAY. Issue #171 — measure what `clippy`, `gates` and `test` cost on a
# GitHub-hosted runner, cold, before #178/#179 move them there.
#
# This file is deleted in the same pull request that adds it. The deliverable is
# the table of numbers, not the workflow. Nothing else in the repository may
# depend on it, and `scripts/gate-status.sh` does not discover it (it reads the
# `jobs:` keys of nightly.yml and ci.yml only, scripts/gate-status.sh:102).
#
# The whole-lane arm ran in earlier revisions of this file (runs 32467869301,
# 32468201653 and 32468444495). This revision carries the **second arm**: does
# splitting the `test` lane into per-crate jobs, each on its own runner with its
# own fresh disk, keep each runner's peak under the default runner's limit?
#
# Why it is worth measuring. The two heaviest dependency subtrees in this
# workspace are disjoint — `cargo tree -p orrery_persistd -i bevy` and
# `cargo tree -p orrery -i foundationdb` both match nothing — so a per-crate job
# compiles a subtree rather than the union, and the crate that needs
# FoundationDB never compiles a line of Bevy.
#
# Three things this measurement has to get right, because they are where it
# would otherwise be meaningless:
#
#   1. Splitting alone does not shrink `target/`. `cargo test -p foo` inside a
#      workspace writes to the *same* shared `target/`, so the saving exists
#      only when each lane has its own runner and its own disk. Hence one job
#      per crate here, never one job running them in sequence.
#   2. Uncached, this is a straight loss on total compute: every job recompiles
#      tokio, serde, iroh. The configuration worth having is per-crate jobs
#      **plus a warm shared remote cache** — and #174 has not built one, so no
#      such cache exists to point these jobs at. What is measured here is
#      therefore the **uncached** case: an upper bound on the compute cost and a
#      lower bound on the benefit. It must not be read as the proposal itself.
#   3. This applies to the `test` lane only. The P2 and P3 gates in `gates`
#      spawn `persistd` and `orrery-coordinator` and drive them, so they need
#      the built binaries whatever the crate boundaries are.
#
# The measurement is deliberately the worst case: no `actions/cache`,
# `RUSTC_WRAPPER` empty (as ci.yml:54 already sets it for hosted runners), no
# `CARGO_TARGET_DIR` relocation. A run that moved `target/` would not be
# measuring the lane (AGENTS.md:202-208).
#
# Sampling. A `df` before and after misses the peak, and the peak is the whole
# question: #168 was `collect2: fatal error: ld terminated with signal 7 [Bus
# error]` — a disk that filled during linking and then freed. So a background
# sampler writes `df -B1` for `/` and `/mnt` plus used memory every 2 s for the
# whole life of the command, and a second sampler `du -sb`s the workspace every
# 30 s. Peaks are reduced from those series, and both series are uploaded as an
# artifact so the reduction is checkable rather than asserted.

name: measure hosted cost (#171, throwaway)

on:
  workflow_dispatch:
  # A `workflow_dispatch`-only workflow cannot be dispatched until it exists on
  # the default branch, and this one is never going to be on the default
  # branch. So it also triggers on pushes to its own branch, and only that
  # branch. It is deleted before the pull request is merged.
  push:
    branches: [ci/measure-hosted-runner-cost]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ci.yml:54 — hosted runners have no kache to hit.
  RUSTC_WRAPPER: ""
  CARGO_INCREMENTAL: 0

jobs:
  split-test:
    name: test -p ${{ matrix.crate }}
    strategy:
      # One crate running out of disk is the most informative result this arm
      # can produce. Never cancel the others because of it.
      fail-fast: false
      matrix:
        # The root workspace's fourteen first-party crates, from
        # `cargo metadata --no-deps` minus the three vendored members the `test`
        # lane already excludes (`bevy_replicon`, `aeronet_iroh`,
        # `aeronet_tokio_runtime` — scripts/check.sh's `lane_test`).
        crate:
          - orrery
          - orrery_authority
          - orrery_conformance
          - orrery_coordinator
          - orrery_core
          - orrery_games
          - orrery_net
          - orrery_persist_client
          - orrery_persistd
          - orrery_predict
          - orrery_protocol
          - orrery_seed
          - orrery_spatial
          - orrery_witness
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Baseline — the machine, before anything is installed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measure"
          df -B1 --output=used,avail / | tail -1 \
            > "$RUNNER_TEMP/measure/baseline-root"
          {
            echo "arch=$(uname -m) nproc=$(nproc)"
            free -h
            df -h / /mnt 2>&1 || true
            lsblk -o NAME,SIZE,MOUNTPOINT 2>&1 || true
          } | tee "$RUNNER_TEMP/measure/machine.txt"
          echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Both prerequisite sets on every leg. A split lane cannot know which
      # crate a job will get without also splitting the prerequisites, and
      # deciding that is #178's design problem, not this measurement's. The
      # cost is visible and small: the `gates` leg measured the apt + FDB +
      # toolchain footprint at 0.99 GiB, against tens of GiB of `target/`.
      - name: Install Bevy's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install the FoundationDB client
        uses: ./.github/actions/foundationdb

      # Deliberately no actions/cache and no kache remote: #174 has not built
      # one. See the header — this is the uncached bound, not the proposal.

      - name: Run this crate's tests with disk and memory sampled underneath
        id: lane
        run: |
          # `set +e` explicitly: the runner's default shell is `bash -e`, so a
          # failing command would abort this step before it could report a
          # single number — exactly backwards for a measurement whose most
          # important possible result is "it did not finish".
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/measure"
          df_csv="$out/df.csv"
          du_csv="$out/du.csv"

          printf 'epoch,root_used,root_avail,mnt_used,mnt_avail,mem_used\n' > "$df_csv"
          (
            while true; do
              r=$(df -B1 --output=used,avail / | tail -1)
              m="0 0"
              [[ -d /mnt ]] && m=$(df -B1 --output=used,avail /mnt | tail -1) || true
              mem=$(free -b | awk '/^Mem:/{print $3}')
              echo "$(date +%s),$(echo $r | tr ' ' ','),$(echo $m | tr ' ' ','),$mem" >> "$df_csv"
              sleep 2
            done
          ) & df_pid=$!

          printf 'epoch,workspace_bytes\n' > "$du_csv"
          (
            while true; do
              echo "$(date +%s),$(du -sb "$GITHUB_WORKSPACE" 2>/dev/null | cut -f1)" >> "$du_csv"
              sleep 30
            done
          ) & du_pid=$!

          start=$(date +%s)
          /usr/bin/time -v -o "$out/time.txt" cargo test -p "${{ matrix.crate }}"
          rc=$?
          # scripts/check.sh's `lane_test` runs a second command, D19's retained
          # Fjall fallback. It belongs to exactly one crate, so it is measured
          # inside that crate's job rather than dropped — dropping it would make
          # the split arm cheaper than the lane it is being compared with.
          if [[ "${{ matrix.crate }}" == orrery_persistd && $rc == 0 ]]; then
            /usr/bin/time -v -o "$out/time-fjall.txt" \
              cargo test -p orrery_persistd --lib \
              --no-default-features --features journal-fjall,chain-grpc
            rc=$?
          fi
          end=$(date +%s)

          kill "$df_pid" "$du_pid" 2>/dev/null || true
          wait "$df_pid" "$du_pid" 2>/dev/null || true

          echo "lane_rc=$rc"             >> "$GITHUB_OUTPUT"
          echo "wall_s=$((end - start))" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reduce the samples to peaks
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/measure"
          read -r base_used base_avail < "$out/baseline-root"

          # Peak = the maximum bytes used on / across the whole series, and the
          # minimum bytes still free across the same series. Both are read from
          # the sampled series, not from a final df.
          read -r peak_used min_avail n < <(
            awk -F, 'NR>1 {
              if ($2 > pu) pu = $2
              if (ma == "" || $3 < ma) ma = $3
              c++
            } END { print pu, ma, c }' "$out/df.csv"
          )
          peak_mem=$(awk -F, 'NR>1 && $6 > m { m = $6 } END { print m+0 }' "$out/df.csv")
          peak_ws=$(awk -F, 'NR>1 && $2 > m { m = $2 } END { print m+0 }' "$out/du.csv")
          max_rss_kb=$(awk '/Maximum resident set size/ { print $NF }' "$out"/time*.txt 2>/dev/null | sort -n | tail -1)

          gb() { awk -v b="$1" 'BEGIN { printf "%.2f", b/1073741824 }'; }

          rc='${{ steps.lane.outputs.lane_rc }}'
          wall='${{ steps.lane.outputs.wall_s }}'
          [[ -n "$rc" ]]   || rc="(step did not report — job was killed)"
          [[ -n "$wall" ]] || wall=0

          {
            echo "## cargo test -p ${{ matrix.crate }} — own runner, cold, no cache"
            echo
            echo "| figure | value |"
            echo "|---|---|"
            echo "| completed | $([[ "$rc" == 0 ]] && echo 'yes' || echo "no (exit $rc)") |"
            echo "| wall-clock | ${wall}s |"
            echo "| runner-minutes at ${NPROC} vCPU | $(awk -v s="$wall" 'BEGIN{printf "%.1f", s/60}') |"
            echo "| peak used on / | $(gb "$peak_used") GiB |"
            echo "| free on / at peak | $(gb "$min_avail") GiB |"
            echo "| peak growth | $(gb "$((peak_used - base_used))") GiB |"
            echo "| peak workspace (du, 30s) | $(gb "$peak_ws") GiB |"
            echo "| peak used memory | $(gb "$peak_mem") GiB |"
            echo "| max RSS | $(awk -v k="${max_rss_kb:-0}" 'BEGIN{printf "%.2f", k/1048576}') GiB |"
            echo "| df samples | $n at 2s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: split-${{ matrix.crate }}
          path: ${{ runner.temp }}/measure/
          retention-days: 30

      - name: This crate's own verdict
        if: always()
        run: |
          rc='${{ steps.lane.outputs.lane_rc }}'
          if [[ "$rc" != 0 ]]; then
            echo "::error::cargo test -p ${{ matrix.crate }} did not complete (exit ${rc:-unknown})"
            exit 1
          fi

# THROWAWAY. Issue #171 — measure what `clippy`, `gates` and `test` cost on a
# GitHub-hosted runner, cold, before #178/#179 move them there.
#
# This file is deleted in the same pull request that adds it. The deliverable is
# the table of numbers, not the workflow. Nothing else in the repository may
# depend on it, and `scripts/gate-status.sh` does not discover it (it reads the
# `jobs:` keys of nightly.yml and ci.yml only, scripts/gate-status.sh:102).
#
# Why the numbers are needed. #170 sizes one risk by assumption: "GitHub-hosted
# `ubuntu-latest` provides roughly 14 GB of free disk; this workspace's
# `target/` reaches 60 GB." Six hosted jobs already pass, but three of them are
# trivial and none of the disk-hungry lanes has ever run there on a
# same-repository event — ci.yml pins them to `[self-hosted, orrery-*]`.
#
# The measurement is deliberately the worst case: no `actions/cache`,
# `RUSTC_WRAPPER` empty (as ci.yml:54 already sets it for hosted runners), no
# `CARGO_TARGET_DIR` relocation. A run that moved `target/` to the second disk
# would not be measuring the lane ci.yml runs (AGENTS.md:202-208).
#
# Sampling. A `df` before and after misses the peak, and the peak is the whole
# question: #168 was `collect2: fatal error: ld terminated with signal 7 [Bus
# error]` — a disk that filled during linking and then freed. So a background
# sampler writes `df -B1` for `/` and `/mnt` plus used memory every 2 s for the
# whole life of the lane, and a second sampler `du -sb`s the workspace every
# 30 s. Peaks are reduced from those series, and both series are uploaded as an
# artifact so the reduction is checkable rather than asserted.

name: measure hosted cost (#171, throwaway)

on:
  workflow_dispatch:
  # A `workflow_dispatch`-only workflow cannot be dispatched until it exists on
  # the default branch, and this one is never going to be on the default
  # branch. So it also triggers on pushes to its own branch, and only that
  # branch. It is deleted before the pull request is merged.
  push:
    branches: [ci/measure-hosted-runner-cost]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ci.yml:54 — hosted runners have no kache to hit.
  RUSTC_WRAPPER: ""
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    name: ${{ matrix.lane }} on ${{ matrix.runner }}${{ matrix.awk != '' && format(' ({0})', matrix.awk) || '' }}
    strategy:
      # One lane running out of disk is the most informative result this
      # workflow can produce. Never cancel the others because of it.
      fail-fast: false
      matrix:
        include:
          # `clippy` and `test` on ubuntu-latest are already measured by the
          # first two runs of this workflow and are not repeated here.
          #
          # The `gates` lane as-is dies in 10 s, before any build, on
          # `scripts/p3-island-gate.sh --self-test`. Measured, not guessed:
          # `diagnose-awk` in run 32468201653 showed the runner image's awk is
          # **gawk 5.2.1**, which drops the trailing lone backslash in
          # `awk -v bin="\"\$$1\" \\"` and so extracts 0 bytes; mawk extracts
          # the 62-byte invocation correctly, and this repository's developer
          # machine has gawk 5.4.1, which also works. So the lane is unrunnable
          # on the hosted image for a reason that has nothing to do with disk,
          # and forcing gawk (run 32468201653's `(gawk)` leg) does not help —
          # gawk 5.2.1 *is* the problem.
          #
          # This leg points `awk` at mawk so the lane runs to the end and #178
          # gets a disk and wall-clock figure. Nothing is skipped, disabled or
          # weakened: more of the lane executes, not less, and the same clause
          # is evaluated — by an awk that reads it correctly. Both the as-is
          # failure and this figure are reported.
          - { lane: gates, runner: ubuntu-latest, awk: mawk }
          # Larger hosted shapes are an organisation feature and this
          # repository is owned by a user account, so `ubuntu-latest-{4,8,16}
          # -core` never picked up a runner. `ubuntu-24.04-arm` is the only
          # other hosted shape reachable here; it is not larger in CPU or RAM
          # but it is a different image with more free disk (109 GiB against
          # 87 GiB). Only `test` is measurable on it: the FoundationDB action
          # downloads `foundationdb-clients_${version}-1_amd64.deb`
          # (.github/actions/foundationdb/action.yml), so the two lanes that
          # need the client cannot run on arm64 as things stand — itself a
          # finding for #179.
          - { lane: test, runner: ubuntu-24.04-arm, awk: '' }
    runs-on: ${{ matrix.runner }}
    # ci.yml gives these lanes 30 minutes on a warm self-hosted box. Cold, with
    # no cache at all, they may take far longer; a bound this generous is there
    # so "it did not finish" means the lane, not the clock.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Baseline — the machine, before anything is installed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measure"
          df -B1 --output=used,avail / | tail -1 \
            > "$RUNNER_TEMP/measure/baseline-root"
          {
            echo "arch=$(uname -m) nproc=$(nproc)"
            free -h
            df -h / /mnt 2>&1 || true
            lsblk -o NAME,SIZE,MOUNTPOINT 2>&1 || true
          } | tee "$RUNNER_TEMP/measure/machine.txt"

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Exactly what ci.yml installs for this lane, and nothing more: `clippy`
      # and `test` need Bevy's Linux build dependencies (ci.yml's "Install
      # Bevy's Linux build dependencies" steps), `clippy` and `gates` need the
      # FoundationDB client. Installing a superset would inflate the disk
      # figure for the lane that does not need it.
      - name: Install Bevy's Linux build dependencies
        if: matrix.lane == 'clippy' || matrix.lane == 'test'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install the FoundationDB client
        if: matrix.lane == 'clippy' || matrix.lane == 'gates'
        uses: ./.github/actions/foundationdb

      - name: Point awk at ${{ matrix.awk }}
        if: matrix.awk != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${{ matrix.awk }}"
          sudo update-alternatives --set awk "/usr/bin/${{ matrix.awk }}"
          readlink -f "$(command -v awk)"
          # Prove the clause that stopped the lane now reads correctly, before
          # spending an hour measuring a lane that would die at the same line.
          scripts/p3-island-gate.sh --self-test

      # Deliberately no actions/cache: #171 measures the uncached worst case so
      # the later cache comparison (#175) has an honest floor.

      - name: Run the lane with disk and memory sampled underneath it
        id: lane
        run: |
          # `set +e` explicitly: the runner's default shell is `bash -e`, so a
          # failing lane would abort this step before it could report a single
          # number — which is exactly backwards for a measurement whose most
          # important possible result is "it did not finish".
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/measure"
          df_csv="$out/df.csv"
          du_csv="$out/du.csv"

          # Every 2 s: bytes used and bytes available on the filesystem the
          # workspace lives on, the same for the second disk at /mnt, and used
          # memory. Cheap enough to run at this interval for hours.
          printf 'epoch,root_used,root_avail,mnt_used,mnt_avail,mem_used\n' > "$df_csv"
          (
            while true; do
              r=$(df -B1 --output=used,avail / | tail -1)
              m="0 0"
              [[ -d /mnt ]] && m=$(df -B1 --output=used,avail /mnt | tail -1) || true
              mem=$(free -b | awk '/^Mem:/{print $3}')
              echo "$(date +%s),$(echo $r | tr ' ' ','),$(echo $m | tr ' ' ','),$mem" >> "$df_csv"
              sleep 2
            done
          ) & df_pid=$!

          # Every 30 s: the size of the checkout, which is target/ plus a few
          # MB. `du` over a large target/ walks hundreds of thousands of
          # inodes, so it gets a slower interval than df — the df series is the
          # one the peak is read from, and this one attributes it.
          printf 'epoch,workspace_bytes\n' > "$du_csv"
          (
            while true; do
              echo "$(date +%s),$(du -sb "$GITHUB_WORKSPACE" 2>/dev/null | cut -f1)" >> "$du_csv"
              sleep 30
            done
          ) & du_pid=$!

          start=$(date +%s)
          # /usr/bin/time -v reports the maximum resident set size seen by any
          # process in the tree it waited on, which is the cheap peak-RSS the
          # issue asks for if it is cheap to get. Not piped anywhere: the full
          # lane log is what makes a failure diagnosable, and a `tail` would
          # throw away the part that names the failing command.
          if [[ -x /usr/bin/time ]]; then
            /usr/bin/time -v -o "$out/time.txt" ./scripts/check.sh "${{ matrix.lane }}"
          else
            echo "note: GNU time absent, peak RSS not measured" | tee "$out/time.txt"
            ./scripts/check.sh "${{ matrix.lane }}"
          fi
          rc=$?
          end=$(date +%s)

          kill "$df_pid" "$du_pid" 2>/dev/null || true
          wait "$df_pid" "$du_pid" 2>/dev/null || true

          echo "lane_rc=$rc"      >> "$GITHUB_OUTPUT"
          echo "wall_s=$((end - start))" >> "$GITHUB_OUTPUT"
          # The step itself does not fail on a failing lane: the report below
          # is the deliverable and it has to run either way. The job's verdict
          # is asserted in the final step instead.
          exit 0

      - name: Reduce the samples to peaks
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/measure"
          read -r base_used base_avail < "$out/baseline-root"

          # Peak = the maximum bytes used on / across the whole series, and the
          # minimum bytes still free across the same series. Both are read from
          # the sampled series, not from a final df.
          read -r peak_used min_avail n < <(
            awk -F, 'NR>1 {
              if ($2 > pu) pu = $2
              if (ma == 0 || $3 < ma) ma = $3
              c++
            } END { print pu, ma, c }' "$out/df.csv"
          )
          peak_mem=$(awk -F, 'NR>1 && $6 > m { m = $6 } END { print m+0 }' "$out/df.csv")
          peak_ws=$(awk -F, 'NR>1 && $2 > m { m = $2 } END { print m+0 }' "$out/du.csv")
          final_ws=$(awk -F, 'END { print $2+0 }' "$out/du.csv")
          max_rss_kb=$(awk '/Maximum resident set size/ { print $NF }' "$out/time.txt" 2>/dev/null || echo 0)

          gb() { awk -v b="$1" 'BEGIN { printf "%.2f", b/1073741824 }'; }

          rc='${{ steps.lane.outputs.lane_rc }}'
          wall='${{ steps.lane.outputs.wall_s }}'
          [[ -n "$rc" ]] || rc="(step did not report — job was killed)"
          [[ -n "$wall" ]] || wall=0

          {
            echo "## ${{ matrix.lane }} on ${{ matrix.runner }} — cold, no cache"
            echo
            echo "| figure | value |"
            echo "|---|---|"
            echo "| completed | $([[ "$rc" == 0 ]] && echo 'yes' || echo "no (exit $rc)") |"
            echo "| wall-clock (lane only) | ${wall}s ($(awk -v s="$wall" 'BEGIN{printf "%dm %02ds", s/60, s%60}')) |"
            echo "| peak bytes used on / | $(gb "$peak_used") GiB |"
            echo "| free bytes on / at peak | $(gb "$min_avail") GiB |"
            echo "| used on / before the lane | $(gb "$base_used") GiB (free $(gb "$base_avail") GiB) |"
            echo "| peak growth attributable to the run | $(gb "$((peak_used - base_used))") GiB |"
            echo "| peak workspace size (du, 30s) | $(gb "$peak_ws") GiB |"
            echo "| workspace size at the end | $(gb "$final_ws") GiB |"
            echo "| peak used memory | $(gb "$peak_mem") GiB |"
            echo "| max RSS of the heaviest process | $(awk -v k="$max_rss_kb" 'BEGIN{printf "%.2f", k/1048576}') GiB |"
            echo "| df samples taken | $n at 2s |"
            echo
            echo '<details><summary>machine</summary>'
            echo
            echo '```'
            cat "$out/machine.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: samples-${{ matrix.lane }}-${{ matrix.runner }}-awk${{ matrix.awk }}
          path: ${{ runner.temp }}/measure/
          retention-days: 30

      - name: The lane's own verdict
        if: always()
        run: |
          rc='${{ steps.lane.outputs.lane_rc }}'
          if [[ "$rc" != 0 ]]; then
            echo "::error::${{ matrix.lane }} did not complete on ${{ matrix.runner }} (exit ${rc:-unknown})"
            exit 1
          fi

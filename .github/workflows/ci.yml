# Orrery's commit-time gates.
#
# The static rules in scripts/core-gates.sh — no Bevy in orrery_core's graph,
# no std HashMap, no ambient inputs, no std transcendentals — are exactly the
# kind that rot silently: nothing breaks the day someone writes
# `Instant::now()` in the core, it just quietly stops being replayable. They
# are enforced here so drift is caught at commit time rather than in the strike
# pipeline months later.
#
# The determinism matrix is P4's non-negotiable deliverable
# (docs/11-roadmap.md §P4): identical core replays on Windows/Linux/macOS
# binaries every commit. It is a *cross-platform* check, so it cannot be done
# by running the test suite on three machines — each would only prove it agrees
# with itself. Every leg emits a digest artifact and a final job compares them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the in-flight run obsolete. main is exempt: its
# history is what the determinism corpus bisects against, so every commit there
# gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml routes rustc through sccache so agent worktrees share one
  # object cache (AGENTS.md § Build cache). Runners are ephemeral and have no
  # sccache installed, so the wrapper is cleared here — the documented opt-out.
  RUSTC_WRAPPER: ""
  # Already off in .cargo/config.toml; restated because a cache miss on a fresh
  # runner is the case where incremental artifacts cost the most and buy least.
  CARGO_INCREMENTAL: 0

jobs:
  # Which runner the heavy Linux jobs get, decided per event.
  #
  # `orrery-hel1-1` is a self-hosted box with a persistent `target/` and a
  # shared sccache, which is worth 5-9 minutes a run — but this repository is
  # **public**, and a self-hosted runner is not ephemeral. A pull request from
  # a fork carries its own `build.rs` and its own test code, and running
  # `cargo test` on it is arbitrary code execution on hardware that survives
  # the job.
  #
  # So fork pull requests go to GitHub-hosted runners and only same-repository
  # events reach the box.
  #
  # **This guard is not the security boundary, and it is important not to
  # mistake it for one.** A `pull_request` workflow runs from the merge of the
  # head and base branches, so a fork can edit *this file* along with the code.
  # What actually gates a fork is the repository's Actions setting, which is
  # now "require approval for all outside collaborators": no fork workflow runs
  # at all until someone approves it. The guard below is defence in depth for
  # the case where a fork PR is approved so it can be reviewed — approving it
  # should not silently mean "run this on my hardware".
  #
  # The third layer is the box itself: the runner is an unprivileged `ci` user
  # with no sudo and no docker group, so the blast radius of a mistake at the
  # first two layers stays inside one home directory.
  runner:
    name: pick runner
    runs-on: ubuntu-latest
    # Every job here declares one. A workflow with no bound falls back to
    # GitHub's six hours, which is not a timeout so much as a way to notice
    # tomorrow that something hung today.
    timeout-minutes: 5
    outputs:
      clippy: ${{ steps.pick.outputs.clippy }}
      gates: ${{ steps.pick.outputs.gates }}
      tests: ${{ steps.pick.outputs.tests }}
    steps:
      - id: pick
        env:
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$SAME_REPO" == "true" ]]; then
            # One runner per job, and the pinning is the point: three runners
            # share the box but not a `target/`, so an unpinned job lands on
            # whichever runner is free and rebuilds against a directory last
            # used by a different job. Pinned, each target/ only ever serves
            # one job and stays warm for it.
            echo 'clippy=["self-hosted","orrery-clippy"]' >> "$GITHUB_OUTPUT"
            echo 'gates=["self-hosted","orrery-gates"]'   >> "$GITHUB_OUTPUT"
            echo 'tests=["self-hosted","orrery-tests"]'   >> "$GITHUB_OUTPUT"
            echo "self-hosted: same-repository ${{ github.event_name }}"
          else
            for j in clippy gates tests; do
              echo "$j=[\"ubuntu-latest\"]" >> "$GITHUB_OUTPUT"
            done
            echo "::notice::fork pull request — running on GitHub-hosted runners"
          fi

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.clippy) }}
    # A self-hosted job queues forever if the box is down; fail instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Route rustc through the shared sccache
        # The workflow env clears RUSTC_WRAPPER because a GitHub runner is
        # ephemeral and has nothing to hit. The self-hosted box is the opposite
        # case: /var/cache/sccache is shared with the dev checkout on the same
        # machine, so a CI build starts warm off whatever was compiled there.
        if: runner.environment == 'self-hosted'
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      # Four first-party crates take `bevy = { workspace = true }` with default
      # features, which pulls bevy_winit and its display/audio stack, so three
      # build scripts probe pkg-config: alsa-sys, libudev-sys and wayland-sys.
      # A developer machine usually has these already; a runner does not.
      #
      # Only this job and `test` need them — the determinism matrix and both
      # nightly gates build Bevy-free crates, which is why those legs stay cheap.
      - name: Install Bevy's Linux build dependencies
        # Pre-installed on the self-hosted box, and the `ci` user has no sudo
        # by design — see the `runner` job.
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      - uses: actions/cache@v6
        # The self-hosted box keeps its target/ between runs; a cache
        # round-trip would cost more than it saves there.
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: clippy-${{ runner.os }}-

      # Vendored crates are excluded: vendor/bevy_replicon carries ~360 findings
      # that are upstream's to fix, and holding third-party code to this repo's
      # lint bar would mean either patching a vendored tree or turning the gate
      # off entirely.
      #
      # `--no-deps` is load-bearing, not decoration. The vendored crates are the
      # only ones that set `[lints] workspace = true`, so the pedantic/nursery
      # levels in [workspace.lints] apply to them through their own manifests —
      # `--exclude` drops them from *selection* but they are still path
      # dependencies, and clippy would lint them anyway. `--no-deps` is what
      # confines the run to the selected packages.
      - name: clippy (default features)
        run: |
          cargo clippy --workspace --all-targets --no-deps \
            --exclude bevy_replicon \
            --exclude aeronet_iroh \
            --exclude aeronet_tokio_runtime \
            -- -D warnings

      # The fdb feature compiles code the default build never sees. It went
      # unlinted long enough for orrery_seed/tests/fdb_gates.rs to stop
      # compiling entirely, so it gets its own pass.
      #
      # It needs the client package even though clippy never links: the
      # `foundationdb-gen` build does `include_bytes!` on
      # /usr/include/foundationdb/fdb.options, so the header is a *compile*
      # input. No server here — running the fdb tests against a real cluster is
      # nightly.yml's job.
      - name: Install the FoundationDB client
        # foundationdb-clients is already installed on the box.
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/foundationdb

      - name: clippy (fdb feature)
        run: |
          cargo clippy -p orrery_persistd -p orrery_seed --all-targets --no-deps \
            --features orrery_persistd/fdb,orrery_seed/fdb \
            -- -D warnings

  gates:
    name: static gates
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.gates) }}
    # A self-hosted job queues forever if the box is down; fail instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Route rustc through the shared sccache
        # The workflow env clears RUSTC_WRAPPER because a GitHub runner is
        # ephemeral and has nothing to hit. The self-hosted box is the opposite
        # case: /var/cache/sccache is shared with the dev checkout on the same
        # machine, so a CI build starts warm off whatever was compiled there.
        if: runner.environment == 'self-hosted'
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        # The self-hosted box keeps its target/ between runs; a cache
        # round-trip would cost more than it saves there.
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: gates-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: gates-${{ runner.os }}-

      # docs/06-verifiable-core.md §8's static gates.
      - name: verifiable-core static gates
        run: scripts/core-gates.sh

      # The P2 and P3 harnesses need FoundationDB and a built cluster, so they
      # cannot run per-commit — the real runs are in nightly.yml. Their
      # `--self-test` modes exist precisely for this: they assert the scripts
      # still contain the stages that make them proofs, catching a regression to
      # a harness that no longer proves its criterion.
      - name: P2 kill-9 gate self-test
        run: scripts/p2-kill9-gate.sh --self-test
      - name: P3 island gate self-test
        run: scripts/p3-island-gate.sh --self-test

      # P1's harness needs no cluster and its hour is simulated, so unlike the
      # two above it *can* run for real — it does, nightly. Per-commit it gets
      # the same structural self-test, which is the cheap half.
      - name: P1 swarm gate self-test
        run: scripts/p1-swarm-gate.sh --self-test

      # The assertion logic in scripts/fdb-tests.sh — no `skipping:` line, a
      # floor on executed tests, every fdb-gated target contributing — is what
      # keeps nightly's fdb job from going green on a cluster that isn't there.
      # It runs against synthetic logs, so it needs no cluster of its own and
      # belongs with the other self-tests.
      - name: fdb test runner self-test
        run: scripts/fdb-tests.sh --self-test

      # ── The standalone tools ────────────────────────────────────────────────
      #
      # Each of these declares its own `[workspace]`, so `cargo test
      # --workspace` in the `test` job does not reach any of them and nothing
      # else here would notice one rotting. `p4-streams-bench` was the only one
      # wired up; the rest carry 48 more tests between them.
      #
      # `p2-load` takes `orrery_persistd` with `features = ["fdb"]`
      # (p2-load/Cargo.toml), so it needs libfdb_c and the headers to build at
      # all — the client package only, no cluster: its tests are unit tests.
      - name: Install the FoundationDB client
        # foundationdb-clients is already installed on the box.
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/foundationdb

      - name: P1 swarm harness tests
        working-directory: p1-swarm
        run: cargo test

      - name: P2 load rig tests
        working-directory: p2-load
        run: cargo test

      - name: P2 dashboard tests
        working-directory: p2-dashboard
        run: cargo test

      # `p4-streams-bench` is a measurement, not a gate — its figures are in its
      # README and the channel-policy decision they justify is in
      # docs/02-networking.md §7. What CI owes it is that it still builds and
      # its unit tests still pass: it has its own workspace, so nothing else
      # here would notice it rotting.
      - name: P4 streams benchmark builds and self-tests
        working-directory: p4-streams-bench
        run: cargo test

      # Compile checks only, and deliberately so: `p0-nat-test`, `p0-dashboard`
      # and `p3-island` have zero tests between them. `cargo test` on any of
      # them would be a build dressed up as a gate, which reads as coverage
      # that does not exist. `p3-island`'s behaviour is asserted by the nightly
      # island gate, and the two p0 tools by the NAT lab they were written for.
      - name: The test-free tools still compile
        run: |
          set -euo pipefail
          (cd p0-nat-test && cargo check --all-targets)
          (cd p0-dashboard && cargo check --all-targets)
          (cd p3-island && cargo check --all-targets)

  test:
    name: workspace tests
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.tests) }}
    # A self-hosted job queues forever if the box is down; fail instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Route rustc through the shared sccache
        # The workflow env clears RUSTC_WRAPPER because a GitHub runner is
        # ephemeral and has nothing to hit. The self-hosted box is the opposite
        # case: /var/cache/sccache is shared with the dev checkout on the same
        # machine, so a CI build starts warm off whatever was compiled there.
        if: runner.environment == 'self-hosted'
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Install Bevy's Linux build dependencies
        # Pre-installed on the self-hosted box, and the `ci` user has no sudo
        # by design — see the `runner` job.
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      - uses: actions/cache@v6
        # The self-hosted box keeps its target/ between runs; a cache
        # round-trip would cost more than it saves there.
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: test-${{ runner.os }}-

      # The full workspace pulls bevy, iroh and tonic. It runs on one platform
      # because that cost is not what the other legs are for: the portable spine
      # is tested on all of them in `determinism` below.
      #
      # Vendored crates are excluded for the same reason clippy excludes them:
      # bevy_replicon's own tests and doctests do not compile under this
      # workspace's feature unification (`bevy/serialize` is off, so
      # `Transform: Serialize` is unsatisfied). That is upstream's build to fix,
      # and it is not what this repo is testing.
      - run: |
          cargo test --workspace \
            --exclude bevy_replicon \
            --exclude aeronet_iroh \
            --exclude aeronet_tokio_runtime

  determinism:
    name: determinism (${{ matrix.label }})
    strategy:
      # One platform failing is the most informative signal this workflow
      # produces — never cancel the others, because *which* platforms diverge
      # is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: x86_64-linux }
          - { os: ubuntu-24.04-arm, label: aarch64-linux }
          - { os: windows-latest,   label: x86_64-windows }
          - { os: macos-latest,     label: aarch64-macos }
    runs-on: ${{ matrix.os }}
    # A cold Windows or macOS leg builds the headless spine from scratch; the
    # corpus itself is seconds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: det-${{ matrix.label }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: det-${{ matrix.label }}-

      # The headless spine only: orrery_conformance and orrery_games depend on
      # orrery_core and orrery_protocol and nothing else, so the whole matrix
      # stays cheap on every platform. These are also the crates that *must* be
      # portable — producing identical bytes everywhere is the core's entire
      # claim.
      #
      # orrery_games is here for the same reason orrery_conformance is, one
      # level up: its committed golden chains (crates/orrery_games/src/golden.rs)
      # are checked inside the ordinary test suite, so each target compares the
      # reference game's own per-tick hashes against the same bytes. That is
      # what makes "the reference game is deterministic across platforms" a
      # per-commit fact rather than an inference from the corpus kernel.
      #
      # orrery_witness is deliberately not here. It enables Bevy by default now
      # (`bevy` is in its default features, pulling bevy_app/bevy_ecs/orrery_net
      # plus a full bevy dev-dependency), which would drag winit and its
      # display stack onto all four runners — and require wayland dev packages
      # on the Linux ones — for a crate whose portability is not what this
      # matrix asserts. It is covered by the `workspace tests` job instead.
      - name: Test the headless spine
        run: cargo test -p orrery_core -p orrery_protocol -p orrery_conformance -p orrery_games

      # Emits this platform's report. The `check` inside the test above already
      # compared against the committed golden; this artifact is what makes a
      # failure diagnosable — it carries per-tick hashes, so the verdict job can
      # name the first diverging tick instead of just saying "they differ".
      - name: Emit this platform's determinism report
        run: cargo run -q -p orrery_conformance -- emit --out report-${{ matrix.label }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.label }}
          path: report-${{ matrix.label }}.json
          retention-days: 30

  determinism-verdict:
    name: determinism verdict
    needs: determinism
    # Runs even when a leg failed: a platform that could not produce a report is
    # itself the finding, and reporting "3 of 5 agreed" beats reporting nothing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: det-x86_64-linux-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: det-x86_64-linux-

      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          path: reports
          merge-multiple: true

      - name: Compare every platform against the Linux baseline
        run: |
          set -euo pipefail
          shopt -s nullglob
          baseline=reports/report-x86_64-linux.json
          if [[ ! -f $baseline ]]; then
            echo "::error::the x86_64-linux baseline report is missing — its leg failed"
            exit 1
          fi

          others=(reports/report-*.json)
          # The baseline compares against itself trivially; drop it so the count
          # in the summary is the number of platforms actually corroborating.
          compared=()
          for f in "${others[@]}"; do
            [[ $f == "$baseline" ]] || compared+=("$f")
          done

          echo "Comparing ${#compared[@]} platforms against x86_64-linux:"
          for f in "${compared[@]}"; do echo "  $f"; done

          # A partial matrix must not pass quietly: if a leg died, the ones
          # that did report agreeing says nothing about the one that didn't.
          # §8 names five targets; x86_64-macos is deliberately not among the
          # four built here — that platform is not supported. Keep this count in
          # step with the matrix above, or a dropped leg passes silently.
          if (( ${#compared[@]} < 3 )); then
            echo "::error::only ${#compared[@]} of 3 non-baseline platforms produced a report"
            cargo run -q -p orrery_conformance -- compare --baseline "$baseline" "${compared[@]}" || true
            exit 1
          fi

          cargo run -q -p orrery_conformance -- compare --baseline "$baseline" "${compared[@]}"

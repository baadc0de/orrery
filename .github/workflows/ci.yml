# Orrery's commit-time gates.
#
# The static rules in scripts/core-gates.sh — no Bevy in orrery_core's graph,
# no std HashMap, no ambient inputs, no std transcendentals — are exactly the
# kind that rot silently: nothing breaks the day someone writes
# `Instant::now()` in the core, it just quietly stops being replayable. They
# are enforced here so drift is caught at commit time rather than in the strike
# pipeline months later.
#
# The determinism matrix is P4's non-negotiable deliverable
# (docs/11-roadmap.md §P4): identical core replays on Windows/Linux/macOS
# binaries every commit. It is a *cross-platform* check, so it cannot be done
# by running the test suite on three machines — each would only prove it agrees
# with itself. Every leg emits a digest artifact and a final job compares them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the in-flight run obsolete. main is exempt: its
# history is what the determinism corpus bisects against, so every commit there
# gets a verdict.
#
# That verdict is the ONLY thing main's own push run owes. `pull_request` builds
# and tests `refs/pull/N/merge` — the PR already merged into main — so re-running
# `clippy`, `static gates` and `workspace tests` after the merge re-tests a tree
# that has already passed. That was originally argued on cost — 802 s of
# self-hosted time on one main run (clippy 76 s, gates 355 s, tests 371 s)
# against 228 s of hosted — and #178 has now moved all three onto hosted
# runners, so that half of the argument no longer applies to any of them.
#
# They stay `pull_request`-only anyway, deliberately: the cost was never the
# only reason. Re-running a lane on a tree it has already passed buys no
# information whichever runner pays for it, and #171 measured the three hosted
# lanes cold at 239 s, 656 s and 674 s, which is not free either. `rustfmt`
# stays everywhere as a cheap tripwire, and the determinism matrix stays
# because the corpus needs a verdict per main commit.
#
# The residual gap is a direct push to main, which now gets rustfmt and
# determinism but not the heavy trio. Closing it is branch protection's job, not
# a duplicate CI run's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml routes rustc through kache so agent worktrees share one
  # object cache (AGENTS.md § Build cache). A runner that has no kache on PATH
  # would fail every rustc invocation, so the wrapper is cleared here — the
  # documented opt-out — and *put back by whichever job installs kache*.
  #
  # This used to read "GitHub-hosted runners are ephemeral and have nothing to
  # hit". That stopped being true on 2026-08-21, when #173/#174 applied the AWS
  # identity plane and the `orrery-kache` S3 bucket: a hosted runner is still
  # ephemeral, but the cache it hits no longer lives on the runner. `clippy`
  # assumes `orrery-ci-cache` by OIDC and installs kache pointed at that bucket
  # (#175), which sets `RUSTC_WRAPPER=kache` through `$GITHUB_ENV`.
  #
  # `test` deliberately does not, and the long block on that job says why with
  # the numbers — #175 wired it, measured it and took it back out. Not every
  # lane is worth a remote, and this default is what a lane falls back to when
  # it is not.
  #
  # `gates` joined that list on 2026-08-21, when #178 moved it off the box.
  # It got no remote either, for a different reason: there is no measurement
  # of one for this lane at all, and #175's `test` numbers are the standing
  # warning against wiring one on the assumption it helps. An open question
  # with a measurement attached, not a gap — see the block on that job.
  #
  # So this default covers: `fmt`, `gates`, `test`, the four determinism legs
  # (Windows and macOS included), the verdict job, and the fork-pull-request
  # path of any lane — a fork gets no `id-token`, so it gets no credential, no
  # cache, and a cold build, which is the intended outcome and not a degraded
  # one.
  RUSTC_WRAPPER: ""
  # Already off in .cargo/config.toml; restated because a cache miss on a fresh
  # runner is the case where incremental artifacts cost the most and buy least.
  CARGO_INCREMENTAL: 0

jobs:
  # No job in this workflow can reach a self-hosted runner, and none exists to
  # reach. #178 pointed `clippy`, `gates` and `test` at `ubuntu-latest`
  # directly; #180 deleted the runner picker they had stopped reading and
  # deregistered the three runners from `orrery-hel1-1`.
  #
  # Why the pinning existed, kept because the reasoning outlives the hardware:
  # the box had a persistent `target/` and a shared build cache worth 5-9
  # minutes a run. But this repository is **public**, and a self-hosted runner
  # is not ephemeral — a fork pull request carries its own `build.rs` and its
  # own test code, and running `cargo test` on it is arbitrary code execution
  # on hardware that survives the job. So fork pull requests went to hosted
  # runners and only same-repository events reached the box.
  #
  # That guard was never the security boundary, and it mattered not to mistake
  # it for one: a `pull_request` workflow runs from the merge of the PR into
  # the base, so the workflow file itself is the base's. The boundary was the
  # ephemerality of the runner, which is why the answer was to stop using a
  # persistent one rather than to guard it more carefully.

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Every workspace, not just the root one: `cargo fmt --all` stops at the
      # workspace boundary and the seven standalone tools each declare their
      # own. scripts/check.sh holds the list.
      - run: scripts/check.sh fmt

  clippy:
    name: clippy
    # Already proven on the PR's merge commit; see the note by `concurrency`.
    if: github.event_name != 'push'
    # Hosted since #178. #171 measured this lane cold and cacheless on
    # `ubuntu-latest` at 239 s and 244 s over two independent samples, peaking
    # at 3.43 GiB of disk growth with 82.78 GiB still free — 24x headroom — and
    # 1.17 GiB peak RSS. No disk-cleanup step and no larger runner (larger
    # runners are an organisation feature this user-owned repository cannot
    # reach at all; #171 probed `-4-core`, `-8-core` and `-16-core` and none
    # ever picked up a runner).
    #
    # #175 then gave it the S3 kache remote below, and this is the lane where
    # that pays. Steady state over three runs on an unchanged tree
    # (https://github.com/baadc0de/orrery/actions/runs/32487828063):
    #
    #   wall-clock  148 s / 131 s / 121 s   mean 133 s vs 241.5 s = -45 %
    #   hit rate    99.9 % / 99.9 % / 100.0 %   (1, 1 and 0 misses of 919)
    #   pulled      0.460 / 0.461 / 0.461 GiB, and nothing uploaded
    #   free disk   81.11 GiB at peak, all three runs
    #
    # 0.461 GiB of egress at $0.09/GB buys 108 s a run: $1.15 per hour of
    # wall-clock saved. `test` measured $16.70 and does not keep its remote.
    # The three samples agree to within 0.3 % on bytes and one cache key on
    # hit rate, which is the other half of why this lane keeps it — `test`'s
    # spread was 2.7x its own saving.
    #
    # 100 % is the ceiling and it is reached because nothing in this lane
    # links: read the rate against AGENTS.md:641-647 before treating a future
    # dip as breakage.
    runs-on: ubuntu-latest
    # The workflow default is `contents: read` and stays that way. `id-token`
    # is what lets this job ask GitHub for the OIDC JWT that
    # `orrery-ci-cache`'s trust policy accepts; without it the job cannot even
    # request a token and the AWS step fails with "Credentials could not be
    # loaded". It is granted per-job, exactly as infra/README.md § Troubleshooting
    # says to. `pull-requests` is deliberately NOT granted — kache-action's
    # sticky PR comment is turned off below and the same report is written to
    # the job summary regardless.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      # A fork pull request is never granted `id-token: write` by GitHub, so
      # there is no token to present and no credential to assume. Rather than
      # let the AWS step fail and read as breakage, both cache steps are
      # skipped on that path and the lane runs cold with the workflow-level
      # `RUSTC_WRAPPER: ""` — the same cold build #171 measured. Nothing about
      # what the lane checks changes.
      ORRERY_CACHE_AVAILABLE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      # #173's federated role. No access key exists anywhere in this design:
      # the role is assumed from the workflow's own OIDC token, the session
      # lasts an hour, and its entire grant is read/write on
      # s3://orrery-kache/artifacts/*.
      - name: Assume the cache role
        if: env.ORRERY_CACHE_AVAILABLE == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::590561279276:role/orrery-ci-cache
          aws-region: eu-central-1
          role-session-name: orrery-ci-clippy-${{ github.run_id }}

      # Installs kache and sets RUSTC_WRAPPER=kache through $GITHUB_ENV, which
      # is what overrides the workflow-level empty default for the steps after
      # it. Deliberately early: the action starts kache's daemon, which
      # warm-prefetches the expensive artifacts named by the previous run's
      # manifest, and that prefetch then overlaps the apt and FoundationDB
      # installs below instead of running on its own clock.
      #
      # No credential input. kache honours KACHE_S3_ACCESS_KEY/SECRET_KEY only
      # when *both* are set and otherwise falls through to reqsign's AWS chain,
      # which reaches AssumeRoleWithWebIdentity — so the role assumed above is
      # picked up with no kache-specific credential configuration at all
      # (docs/spikes/kache-remote-backend.md § 2).
      #
      # `manifest-key` is per-lane on purpose: every build sharing the bucket
      # writes the manifest, so `clippy` and `test` without distinct keys would
      # clobber each other's and prefetch would fall to near zero.
      - name: Install kache and point it at the S3 remote
        if: env.ORRERY_CACHE_AVAILABLE == 'true'
        uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b # main@2026-06-19
        with:
          version: 0.14.2
          s3-bucket: orrery-kache
          s3-region: eu-central-1
          s3-prefix: artifacts
          manifest-key: clippy-x86_64-unknown-linux-gnu
          pr-comment: false
          # THE MOST REUSABLE THING #175 FOUND, AND IT IS NOT ABOUT THIS
          # LANE. `kache doctor` reports the runner's cache filesystem as
          # "Cache FS  ext2/3/4 (local)" — ext4 WITHOUT reflink support. So a
          # stored or restored artifact is a second PHYSICAL copy of the file
          # in `target/`, not a copy-on-write clone, and the local store is
          # roughly a duplicate of the cacheable part of `target/` rather than
          # free. That invalidates a premise #171 and #192 both rest on: the
          # store has to fit inside #171's free-at-peak headroom, and on
          # kache's 50 GiB default it does not.
          #
          # Measured, not reasoned about. The first run of #175
          # (https://github.com/baadc0de/orrery/actions/runs/32486274447) left
          # the default in place and the `test` lane died 13 min in with
          #   error: failed to build archive at .../libiroh-*.rlib:
          #          No space left on device (os error 28)
          # and `df` reading `145G 145G 29M 100% /` — on the lane #171 had
          # measured with 39.29 GiB to spare. Anyone wiring a Rust object
          # cache onto a hosted runner will hit this; budget the store against
          # free-at-peak, and sample the peak rather than reading `df` at the
          # end, because a run that filled the disk prints a healthy number
          # afterwards.
          #
          # This lane is nowhere near the cap — 1.7 GiB store, 81 GiB free —
          # so the number here is cheap insurance and a place to record the
          # finding, not a live constraint. Note also that the cap is soft:
          # eviction lags, and `test` was observed at 28.2 GiB against a
          # 20 GiB cap (141 %) before it was taken off the remote.
          max-size: 20GiB

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Four first-party crates take `bevy = { workspace = true }` with default
      # features, which pulls bevy_winit and its display/audio stack, so three
      # build scripts probe pkg-config: alsa-sys, libudev-sys and wayland-sys.
      # A developer machine usually has these already; a runner does not.
      #
      # Only this job and `test` need them — the determinism matrix and both
      # nightly gates build Bevy-free crates, which is why those legs stay cheap.
      - name: Install Bevy's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      # Registry and git checkouts only — deliberately not `target/`.
      #
      # `target/` was in this list while the hosted path was the rarely-taken
      # fork-PR branch. Now that it is the only path it has to be sized. #171
      # measured `test`'s cold `target/` at 45.65 GiB with 39.29 GiB free at
      # peak, so tarring it would not fit on the disk that produced it, and the
      # repository's whole Actions cache allowance is 10 GB — the save would
      # spend minutes compressing and then be rejected. `clippy`'s own 1.79 GiB
      # would fit, but the two lanes are kept symmetrical rather than one of
      # them silently doing something different.
      #
      # The registry is a few hundred MB, restores in seconds, and is the part
      # a cold runner otherwise re-downloads. It stays alongside the kache
      # remote rather than being replaced by it, because the two cache
      # different things and neither is a substitute for the other: kache
      # caches rustc *outputs*, `actions/cache` caches crate *sources*. A
      # 100 % kache hit rate still needs the sources on disk for cargo to
      # resolve the graph at all.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: clippy-${{ runner.os }}-

      # The second clippy pass covers the `fdb` feature, which compiles code the
      # default build never sees — it went unlinted long enough for
      # orrery_seed/tests/fdb_gates.rs to stop compiling entirely. That pass
      # needs the client package even though clippy never links: the
      # `foundationdb-gen` build does `include_bytes!` on
      # /usr/include/foundationdb/fdb.options, so the header is a *compile*
      # input. No server here — running the fdb tests against a real cluster is
      # nightly.yml's job.
      - name: Install the FoundationDB client
        uses: ./.github/actions/foundationdb

      # Evidence, not assertion — and it fails the job rather than warning,
      # because a silently-unwired cache is the failure mode this whole issue
      # exists to avoid: the lane would still be green, just paying full price
      # while a table claimed otherwise.
      #
      # Two independent things are checked. RUSTC_WRAPPER must actually be
      # `kache` in this step's environment, which is the empirical answer to
      # whether a $GITHUB_ENV write beats a workflow-level `env:` of the same
      # name (it does; this step is what proves it rather than assuming it).
      # And `kache doctor` must name the bucket — its "Remote" check prints
      # `s3://<bucket>/<prefix>` from the resolved config, so grepping for the
      # exact URI distinguishes "a remote is configured" from "some remote is
      # configured". doctor's exit status is deliberately not the assertion:
      # it reports the daemon unit as missing on any runner, which is expected
      # and not a problem (AGENTS.md § Build cache).
      - name: Confirm rustc is wrapped and the S3 remote is configured
        if: env.ORRERY_CACHE_AVAILABLE == 'true'
        run: |
          set -euo pipefail
          echo "RUSTC_WRAPPER=${RUSTC_WRAPPER:-<unset>}"
          [[ "${RUSTC_WRAPPER:-}" == *kache* ]] || {
            echo "::error::RUSTC_WRAPPER is not kache — the lane would build uncached"
            exit 1
          }
          kache doctor 2>&1 | tee doctor.txt || true
          grep -qF 's3://orrery-kache/artifacts' doctor.txt || {
            echo "::error::kache doctor does not report the s3://orrery-kache/artifacts remote"
            exit 1
          }

      # #171 made the case that a `df` before and after misses the peak, and
      # the peak is the whole question. That is even truer with a cache: the
      # local store and `target/` grow together and the store evicts under its
      # cap, so the end-of-run reading understates what the disk actually had
      # to hold. Two-second sampling for the life of the lane, same interval
      # #171 used, so the two numbers are comparable.
      - name: Start the free-disk sampler
        if: env.ORRERY_CACHE_AVAILABLE == 'true'
        run: |
          set -euo pipefail
          nohup bash -c 'while :; do df -B1 --output=avail / | tail -1; sleep 2; done' \
            > "$RUNNER_TEMP/avail.txt" 2>/dev/null &
          echo "sampling free bytes on / every 2 s into $RUNNER_TEMP/avail.txt"

      # All three passes, and the `--exclude`/`--no-deps` reasoning that makes them
      # mean something, live in scripts/check.sh so this job is reproducible
      # locally with one command.
      - name: clippy (default raw, fdb, then Fjall fallback)
        run: scripts/check.sh clippy

      # #170 asks for a hit rate and a wall-clock. infra/README.md § What it
      # costs asks for one more, and it is the one that decides the economics:
      # hosted runners are outside AWS, so every cache HIT is billable egress
      # at $0.09/GB past the free tier — the bill scales with the mechanism
      # working. `network.bytes_down` is that number, on the wire and after
      # compression. Read from kache's own report rather than inferred, per
      # #175's acceptance criteria, and uploaded raw so it is recomputable.
      #
      # `if: always()` because a failed lane's cache figures are still data.
      # Note this runs BEFORE kache-action's post step does `kache sync --push`,
      # so `bytes_up` here undercounts the run's uploads; `bytes_down` — the
      # billed direction — is complete.
      - name: Cache report
        if: always() && env.ORRERY_CACHE_AVAILABLE == 'true'
        run: |
          set -euo pipefail
          # Disk alongside the cache figures: a warm lane restores artifacts
          # into `target/` *and* keeps them in the local store, so the cache
          # changes the disk answer #171 measured and the new number should be
          # on the record next to it. `min_free_bytes` is the minimum over the
          # sampled series — the figure directly comparable to #171's "free at
          # peak" column.
          df -h /
          if [[ -s "$RUNNER_TEMP/avail.txt" ]]; then
            echo "min_free_bytes     $(sort -n "$RUNNER_TEMP/avail.txt" | head -1)"
            echo "df_samples         $(wc -l < "$RUNNER_TEMP/avail.txt")"
          fi
          kache stats --since 24h || true
          kache report --format json --since 24h --output kache-clippy.json
          {
            echo '### kache — clippy'
            echo '```'
            # `network` is an Option in kache's report schema and is null when
            # no transfer happened at all, so every read of it is defaulted.
            jq -r '
              (.network // {}) as $n |
              "hit_rate_pct       \(.summary.hit_rate_pct)",
              "local_hits         \(.summary.local_hits)",
              "remote_hits        \(.summary.remote_hits)",
              "prefetch_hits      \(.summary.prefetch_hits)",
              "misses             \(.summary.misses)",
              "total_crates       \(.summary.total_crates)",
              "configured_backend \($n.configured_backend // "none")",
              "bytes_down         \($n.bytes_down // 0)",
              "bytes_up           \($n.bytes_up // 0)",
              "downloads_ok       \($n.downloads_ok // 0)",
              "downloads_failed   \($n.downloads_failed // 0)"
            ' kache-clippy.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && env.ORRERY_CACHE_AVAILABLE == 'true'
        with:
          name: kache-report-clippy
          path: kache-clippy.json
          retention-days: 30

  gates:
    name: static gates
    # Already proven on the PR's merge commit; see the note by `concurrency`.
    if: github.event_name != 'push'
    # Hosted since #178, and the last lane to get there. It was never short of
    # headroom: #171 measured it cold and cacheless on `ubuntu-latest` at
    # **656 s**, peaking at 17.57 GiB of disk growth with **68.64 GiB still
    # free** — 3.9x headroom — so no disk-cleanup step and no larger runner.
    # (Larger runners are unreachable anyway: they are an organisation feature
    # and this repository is user-owned; #171 probed `ubuntu-latest-4-core`,
    # `-8-core` and `-16-core` and none ever picked up a runner.
    # `ubuntu-24.04-arm` is out for a different reason —
    # `.github/actions/foundationdb/action.yml` fetches an amd64 `.deb`, and
    # this lane needs that package.)
    #
    # What actually held it on the box was correctness, not capacity:
    # `scripts/check.sh gates` exited 2 after 4.5 s on
    # `scripts/p3-island-gate.sh --self-test` under the `ubuntu-latest` image's
    # gawk 5.2.1, which dropped a trailing backslash in an `awk -v` assignment
    # and extracted 0 bytes, so every `runs` clause misfired. #195 fixed that
    # (the sentinel is built inside awk's `BEGIN` block, so nothing passes
    # through `-v`) and this job moved. The same bug was already reaching fork
    # pull requests, which the picker's else-branch has always sent here.
    #
    # NO S3 KACHE REMOTE, AND THAT IS ON PURPOSE. #175 gave one to `clippy`
    # ($1.15 per hour of wall-clock saved) and measured `test` at $16.70 with a
    # hit rate that swung 63.7 % -> 89.4 % on an unchanged tree, then took it
    # back out — see the long block on `test` below. `gates` has no measurement
    # of its own either way, so it starts where #171 measured it: cold. Wiring
    # a remote here on the assumption that it helps is exactly the move #175
    # exists to warn against. A follow-up may measure it — this lane's shape
    # (many small standalone-workspace builds, and it does link) is not
    # `clippy`'s and not `test`'s, so neither result predicts it.
    runs-on: ubuntu-latest
    # 656 s measured cold; 30 minutes is ~2.7x that, so a lane that hangs says
    # so rather than burning the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Registry and git checkouts only — deliberately not `target/`, the same
      # judgement as `clippy` and `test` and for the same two reasons. This
      # lane's `target/` grows 17.57 GiB (#171); the repository's entire
      # Actions cache allowance is 10 GB, so the save would spend minutes
      # compressing and then be rejected. The sources are a few hundred MB and
      # are the part a cold runner otherwise re-downloads.
      #
      # `target` WAS in this list, because until now this step only ran on the
      # rarely-taken fork-PR branch. As the only path it has to be sized, and
      # it does not size.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: gates-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: gates-${{ runner.os }}-

      # `p2-load` and `p3-siblings` both take `orrery_persistd` with
      # `features = ["fdb"]` (their Cargo.tomls), so they need libfdb_c and the
      # headers to build at all — the client package only, no cluster: their
      # tests are unit tests. `p3-siblings` joined that list with the P5
      # double-spend race, which reads `ledger/item/{uid}` back out of the
      # durable tier rather than trusting the gateways' acks.
      #
      # Unconditional now: there is only one environment left in this job. The
      # guard existed because the box already had `foundationdb-clients`.
      - name: Install the FoundationDB client
        uses: ./.github/actions/foundationdb

      # docs/06-verifiable-core.md §8's static gates, the four harness
      # `--self-test` modes, and the standalone tools' own suites. Which of the
      # eight workspaces gets `cargo test` and which gets `cargo check`, and why,
      # is in scripts/check.sh's lane table — the same table its `--self-test`
      # holds against the filesystem so a new workspace cannot appear unchecked.
      - name: static gates, harness self-tests, standalone tools
        run: scripts/check.sh gates

  test:
    name: workspace tests
    # Already proven on the PR's merge commit; see the note by `concurrency`.
    if: github.event_name != 'push'
    # Hosted since #178, and this is the lane whose fit was in question. #171
    # measured it cold on `ubuntu-latest` twice: 674 s and 681 s wall-clock,
    # 46.92 GiB peak disk growth, **39.29 GiB still free at the peak** — 0.84x
    # its own footprint again — and 6.59 GiB peak RSS against 15 GiB. It fits,
    # but it is the tightest lane and there is no escalation path: #171 probed
    # `ubuntu-latest-4-core`, `-8-core` and `-16-core` and none of them ever
    # picked up a runner, because larger runners are an organisation feature
    # and this repository is user-owned. `ubuntu-24.04-arm` has more disk but
    # is not reachable either: `.github/actions/foundationdb/action.yml:36`
    # fetches an amd64 `.deb`. So if this lane's `target/` grows by 84 %, the
    # answer is to shrink or split the lane, not to ask for a bigger machine.
    #
    # ---------------------------------------------------------------------
    # THIS LANE DELIBERATELY HAS NO S3 KACHE REMOTE, AND THAT IS A MEASURED
    # DECISION RATHER THAN AN OMISSION. #175 wired one in, ran it, and took it
    # back out. Do not re-add it without reading this block.
    #
    # Steady state over three runs on an unchanged tree
    # (https://github.com/baadc0de/orrery/actions/runs/32487828063):
    #
    #   wall-clock  562 s / 690 s / 637 s   mean 630 s vs #171's 677.5 s = -7 %
    #   hit rate    75.2 % / 63.7 % / 89.4 %
    #   pulled      2.64 / 1.81 / 2.47 GiB  mean 2.30 GiB per run
    #
    # Three things kill it, in order of how much they matter.
    #
    # 1. THE VARIANCE EXCEEDS THE SAVING. The 128 s spread across three runs
    #    of the *same tree* is 2.7x the 48 s the cache saves. #171's two
    #    uncached samples of this lane agreed to within 1 % (674 s / 681 s),
    #    so that variance is the cache's, not the runner's. A cache that adds
    #    more variance than it removes latency is not worth paying for.
    #
    # 2. THE EGRESS IS THE BILL, AND IT SCALES WITH THE CACHE *WORKING*.
    #    A GitHub-hosted runner is on Azure; the bucket is in eu-central-1.
    #    Every byte pulled is billed at $0.09/GB past the 100 GB free tier, so
    #    2.30 GiB per run at this repository's measured ~29 PR runs/day is
    #    ~$200/month — for 48 s a run. That is $16.70 per hour of wall-clock
    #    saved. `clippy`, which keeps its remote, is $1.15.
    #
    # 3. THE HIT RATE IS NOT STABLE. 63.7 % -> 89.4 % on identical inputs. The
    #    low run uploaded only 0.136 GiB against 356 misses, i.e. those misses
    #    re-produced content the bucket already held — they were remote
    #    *lookup failures degraded to misses*, not cache-key misses. kache's
    #    own report names the cause: remote open/setup latency (~4 min
    #    aggregate) exceeding read/transfer time, at ~312 ms per remote hit
    #    across two clouds.
    #
    # And cold is not a defeat here: #171 measured a cold hosted `test` at
    # 674 s against 890 s for the box's slowest *warm* run of the same lane.
    #
    # THE TRIGGER TO PUT IT BACK, so nobody has to re-derive this: when the
    # runners for this lane live in eu-central-1 with the bucket (#176's
    # ephemeral machines, #180's retirement of the box). At that point both
    # objections above dissolve at once rather than being traded off — the
    # traffic is intra-region so the egress line goes to $0, and the ~312 ms
    # cross-cloud round trip that produces the lookup failures goes with it.
    # Re-measure then; do not assume the -7 % becomes a win, prove it.
    #
    # One constraint that survives the move and must be carried with it: the
    # runner's root filesystem is ext4 WITHOUT reflink support, so kache's
    # local store is a second physical copy of the cacheable part of
    # `target/`, not a copy-on-write clone. See the cap on `clippy`'s
    # kache-action step — on this lane it is the difference between fitting
    # and `No space left on device`.
    # ---------------------------------------------------------------------
    runs-on: ubuntu-latest
    # This remains the outer lane backstop. scripts/check.sh gives #290's
    # intermittently hanging torn-tail proptest its own 60-second bound, so a
    # recurrence fails with the test name instead of surfacing as a cancelled
    # 30-minute job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Bevy's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      # Registry and git checkouts only, and here the reason is load-bearing
      # rather than tidiness: see the note on the same step in `clippy`. This
      # lane's `target/` is 45.65 GiB on a disk with 39.29 GiB free at peak, so
      # caching it would fill the disk trying to compress it — the exact
      # failure mode (#168, `ld terminated with signal 7`) this migration
      # exists to leave behind.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: test-${{ runner.os }}-

      # The full workspace pulls bevy, iroh and tonic. It runs on one platform
      # because that cost is not what the other legs are for: the portable spine
      # is tested on all of them in `determinism` below.
      #
      # Vendored crates are excluded for the same reason clippy excludes them:
      # bevy_replicon's own tests and doctests do not compile under this
      # workspace's feature unification (`bevy/serialize` is off, so
      # `Transform: Serialize` is unsatisfied). That is upstream's build to fix,
      # and it is not what this repo is testing.
      - run: scripts/check.sh test

  determinism:
    name: determinism (${{ matrix.label }})
    strategy:
      # One platform failing is the most informative signal this workflow
      # produces — never cancel the others, because *which* platforms diverge
      # is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: x86_64-linux }
          - { os: ubuntu-24.04-arm, label: aarch64-linux }
          - { os: windows-latest,   label: x86_64-windows }
          - { os: macos-latest,     label: aarch64-macos }
    runs-on: ${{ matrix.os }}
    # A cold Windows or macOS leg builds the headless spine from scratch; the
    # corpus itself is seconds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: det-${{ matrix.label }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: det-${{ matrix.label }}-

      # The headless spine only: orrery_conformance and orrery_games depend on
      # orrery_core and orrery_protocol and nothing else, so the whole matrix
      # stays cheap on every platform. These are also the crates that *must* be
      # portable — producing identical bytes everywhere is the core's entire
      # claim.
      #
      # orrery_games is here for the same reason orrery_conformance is, one
      # level up: its committed golden chains (crates/orrery_games/src/golden.rs)
      # are checked inside the ordinary test suite, so each target compares the
      # reference game's own per-tick hashes against the same bytes. That is
      # what makes "the reference game is deterministic across platforms" a
      # per-commit fact rather than an inference from the corpus kernel.
      #
      # orrery_witness is deliberately not here. It enables Bevy by default now
      # (`bevy` is in its default features, pulling bevy_app/bevy_ecs/orrery_net
      # plus a full bevy dev-dependency), which would drag winit and its
      # display stack onto all four runners — and require wayland dev packages
      # on the Linux ones — for a crate whose portability is not what this
      # matrix asserts. It is covered by the `workspace tests` job instead.
      - name: Test the headless spine
        run: cargo test -p orrery_core -p orrery_protocol -p orrery_conformance -p orrery_games

      # Emits this platform's report. The `check` inside the test above already
      # compared against the committed golden; this artifact is what makes a
      # failure diagnosable — it carries per-tick hashes, so the verdict job can
      # name the first diverging tick instead of just saying "they differ".
      - name: Emit this platform's determinism report
        run: cargo run -q -p orrery_conformance -- emit --out report-${{ matrix.label }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.label }}
          path: report-${{ matrix.label }}.json
          retention-days: 30

  determinism-verdict:
    name: determinism verdict
    needs: determinism
    # Runs even when a leg failed: a platform that could not produce a report is
    # itself the finding, and reporting "3 of 5 agreed" beats reporting nothing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: det-x86_64-linux-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: det-x86_64-linux-

      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          path: reports
          merge-multiple: true

      - name: Compare every platform against the Linux baseline
        run: |
          set -euo pipefail
          shopt -s nullglob
          baseline=reports/report-x86_64-linux.json
          if [[ ! -f $baseline ]]; then
            echo "::error::the x86_64-linux baseline report is missing — its leg failed"
            exit 1
          fi

          others=(reports/report-*.json)
          # The baseline compares against itself trivially; drop it so the count
          # in the summary is the number of platforms actually corroborating.
          compared=()
          for f in "${others[@]}"; do
            [[ $f == "$baseline" ]] || compared+=("$f")
          done

          echo "Comparing ${#compared[@]} platforms against x86_64-linux:"
          for f in "${compared[@]}"; do echo "  $f"; done

          # A partial matrix must not pass quietly: if a leg died, the ones
          # that did report agreeing says nothing about the one that didn't.
          # §8 names five targets; x86_64-macos is deliberately not among the
          # four built here — that platform is not supported. Keep this count in
          # step with the matrix above, or a dropped leg passes silently.
          if (( ${#compared[@]} < 3 )); then
            echo "::error::only ${#compared[@]} of 3 non-baseline platforms produced a report"
            cargo run -q -p orrery_conformance -- compare --baseline "$baseline" "${compared[@]}" || true
            exit 1
          fi

          cargo run -q -p orrery_conformance -- compare --baseline "$baseline" "${compared[@]}"

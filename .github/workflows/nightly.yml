# The phase gates that need real processes, real crashes and a real cluster.
#
# P2's kill-9 harness and P3's island harness are proof harnesses: neither
# writes a success artifact unless every clause of its phase's demo criterion
# holds. That makes them slow and stateful — eight peers, a 10 s lease TTL, a
# FoundationDB cluster — so they cannot gate a pull request. They run here
# instead, nightly and on demand, which is the "kept green in CI thereafter"
# half of the roadmap's demo-or-it-didn't-happen rule (docs/11-roadmap.md
# §Sequencing principle 3).
#
# Their `--self-test` modes run per-commit in ci.yml; those check the scripts
# still contain the stages that make them proofs, not that the proofs pass.
#
# Two jobs here are not gates. `p4-accumulate` produces evidence rather than
# guarding against a regression: P4 exits on 500 accumulated honest player-hours
# and the gates cannot supply them, because a gate is required to re-run the
# same thing every night and 32 hours re-run three hundred times are 32 hours.
# It varies its seed, sweeps the criterion's 3–5% loss band, and appends one
# deduplicated line per banked run to a ledger carried between nights. A leg
# that fails there is a finding and banks nothing; it does not fail the other
# jobs. Its two scripts self-test in this workflow rather than in ci.yml,
# because scripts/check.sh enumerates the four *gate* self-tests it runs and
# these are not gates. (That enumeration is worth a look next time someone
# touches it: the two `p4-*` self-tests run only here, so a structural
# regression in them survives a whole day of commits.)
#
# It is a three-way matrix as of this change — the box, `windows-latest` and
# `macos-latest` — because the criterion is 500 hours *across all three
# platforms* and every runner that could execute the leg before was Linux.
# `p4-platform-ledger` follows it: it requires the three platforms' fixed-seed
# probe reports to be identical field for field, and totals the three ledger
# shards into one per-platform view. A platform whose probe diverges is a
# finding about that platform, not a reason to widen the comparison.

# ── Where these run ──────────────────────────────────────────────────────────
#
# Nightly fires on a schedule and on workflow_dispatch, never on a pull
# request. Every job runs on a GitHub-hosted runner.
#
# #179 triaged every job in this file by what it actually *needs*, rather than
# moving them as a block, because the three answers want three different
# machines and only one of them is `ubuntu-latest`.
#
# ── A. Needs a device that passes D19's qualification ────────────────────────
#
# `p2-kill9`, and nothing else. It is the only gate here carrying a
# `journal_commit_ms` verdict against D16's 2 ms budget, and the only one with
# a `fio` preflight (`scripts/p2-kill9-gate.sh`, `reduce_device_qualification`)
# to decide whether that verdict may be issued at all. D19 took its reference
# numbers on a `c4d-standard-32-lssd` local NVMe; D23 records that this
# repository's box fails the same qualification outright at a bare `fdatasync`
# p99 of 7.045 ms, and says plainly that the latency verdict there is the
# device's rather than the code's.
#
# It already runs on `ubuntu-latest` — it was there before #179 and #179 did
# not put it there — and a hosted runner will not qualify either, so #190's
# preflight withholds the verdict and reports UNQUALIFIED. That is the designed
# behaviour and not a regression, but it does mean D19's own numbers are not
# falsifiable anywhere in this workflow today. **Fixing that is #176's
# ephemeral-instance work, not this file's**, and nothing here should be read
# as a claim that a hosted runner is an adequate home for this gate.
#
# ── B. Needs a live FoundationDB server, but no qualified device ─────────────
#
# `p3-siblings`, `p5-dupe-gauntlet` and `fdb-tests`. All three were already
# hosted and stay hosted, and the reason is unchanged: provisioning a throwaway
# cluster means `sudo dpkg -i` on the server package, which the box's
# unprivileged `ci` user could not do, and the `fdbserver` the box *does* run
# is a shared development database these gates must never be pointed at,
# because each writes into whatever cluster it is given at fixed keys
# (docs/11-roadmap.md, C-8). `.github/actions/foundationdb` installs the client
# by default and a self-configuring single-node server on `server: "true"`, and
# their green runs are the evidence that this works on `ubuntu-latest`. Their
# budgets are handover and settle windows, not device latency, so category A's
# problem is not theirs.
#
# Kept from the version of this note #185 corrected, because it is the accurate
# form of a claim that was wrong for years: the reason is *not*
# `scripts/fdb-dev.sh`, which takes its port and data directory from the
# environment (`ORRERY_FDB_DEV_PORT`, `ORRERY_FDB_DEV_DIR`) and no longer stops
# anything by port, and `scripts/p2-kill9-gate.sh` never called that harness in
# the first place — it reads `ORRERY_FDB_CLUSTER_FILE` and nothing else.
#
# ── C. Needs neither ─────────────────────────────────────────────────────────
#
# `p1-swarm`, `p4-accumulate`, `p4-platform-ledger`, `determinism-soak` — and
# these are what #179 moved to `ubuntu-latest`:
#
#   * `p1-swarm` and both `p4-*` jobs run the `p1-swarm` harness, a headless
#     in-process simulation on a simulated clock. No socket, no cluster, no
#     fixed port, and no wall-clock assertion — its peers are coupled by an
#     in-process router, so a slower machine costs time and changes no verdict.
#   * `determinism-soak` builds one deliberately dependency-light Bevy-free
#     crate and runs it ten times, comparing digests to each other.
#
# What the box was buying them was a warm `target/` and a `kache` remote, i.e.
# wall-clock, and each job's `timeout-minutes` below now carries the measured
# hosted figure it was re-sized against rather than the box's.
#
# ── The exception, and why the box is still here ─────────────────────────────
#
# `p3-island` is in category C by every prerequisite and **still failed on
# `ubuntu-latest`**, so it kept the box. The long note on that job has the
# measurement; the short version was that its P3 criterion held fine on a
# hosted runner and the drain leg #168 added did not, for a reason no timeout
# addressed. #236 fixed that at the source — the leg now asserts an invariant
# rather than a wall-clock bound — and #180 moved the job, which is what let
# the final persistent runner registration be removed.
#
# The historical note that belongs with `p3-island` and is not a runner
# question: it failed its first run *on the box*, and the move there was not
# why. The harness had gone deaf to the gateway's control replies when
# `8fd8c22` put them on a reliable stream, and the same failure — `only 0/50
# claims answered`, eight peers each reporting an unanswered hello —
# reproduces on a developer's shell with no CI in sight. Fixed in
# `p3-island/src/wire.rs`.
#
# ── The budget every hosted job here lives inside ────────────────────────────
#
# From #171: `ubuntu-latest` is a single 145 GiB root filesystem with roughly
# 84-88 GB free at job start depending on the image build — #171's "87 GiB"
# was that byte count read in decimal gigabytes (81.1 GiB); clippy's sampled
# minimum on 2026-08-23 was min_free_bytes 87086202880 = 81.1 GiB mid-run.
# 4 vCPU and 15 GiB of RAM. **Larger runners are
# unavailable to this repository** — `ubuntu-latest-4-core`, `-8-core` and
# `-16-core` were each probed and never picked up a runner; they are an
# organisation feature and this repository is user-owned. `ubuntu-24.04-arm`
# has more disk but is out for category B, whose composite action fetches an
# amd64 `.deb`. So there is no escalation path: a job that stops fitting is a
# finding for #170, not a runner-size change.

name: Nightly gates

on:
  schedule:
    # 03:00 UTC daily. Nothing depends on the hour; it is off-peak for runners.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  CARGO_INCREMENTAL: 0

jobs:
  p1-swarm:
    name: P1 swarm gate (32 peers, one simulated hour, clean + impaired + witnessed)
    # Simulated hour, no cluster, no ports, no shared state: the harness couples
    # its 32 peers through an in-process router, so nothing in it contends with
    # anything and it was never the box's to keep.
    #
    # Hosted since #179. Cold and cacheless on `ubuntu-latest`, peaking at
    # **2.18 GiB** of disk growth with **84.04 GiB still free** — 38x headroom,
    # so no disk-cleanup step and no larger runner (there is no larger runner;
    # see the header).
    runs-on: ubuntu-latest
    # Three simulated hours plus a five-minute island, and the hour is
    # simulated, so it costs what it costs to compute. The witnessed leg is the
    # expensive one — every peer re-executes its witness set's logs as well as
    # its own — and the cold build accounts for a good share of the rest.
    #
    # Re-sized from 45 to 75, and the reason is variance rather than the mean.
    # Two cold samples on `ubuntu-latest` at the same tree came in at **1246 s**
    # and **1970 s** (runs 32507043296 and 32503887628) against 1044 s on the
    # box on 2026-08-21 — so the same work is 1.2x the box on a good runner and
    # 1.9x on a bad one, a 58 % spread with nothing changed. At 45 minutes the
    # slower sample would have had 1.37x headroom, which is thin enough that an
    # ordinary bad draw reads as a gate failure; at 75 it has 2.3x.
    #
    # This is a raise for a runner that is measurably slower and measurably
    # inconsistent, not a raise to absorb a hang. The distinction matters and it
    # is checkable: this harness reads no clock and opens no socket, so its cost
    # is a function of the tree. If it ever exceeds this bound, that is a real
    # regression in the simulation's cost and not something to re-size again.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Unconditional since #179: there is one environment left in this job.
      # The box had these pre-installed and its `ci` user had no sudo, which is
      # what the guard was for.
      - name: Install Bevy's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      - name: Run the swarm gate
        run: scripts/p1-swarm-gate.sh

      - name: Upload the gate's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p1-swarm-evidence
          path: target/p1-swarm/
          retention-days: 14
          if-no-files-found: warn

  p4-accumulate:
    name: P4 hour accumulation (${{ matrix.platform }}, one witnessed hour, swept across the loss band)
    # Deliberately not part of the swarm gate above, and not a gate at all. That
    # job re-runs one fixed hour — seed 1, 3% loss — every night, which is what
    # a regression harness should do and is exactly why it accumulates nothing:
    # its report's `RunIdentity` is byte-identical from one night to the next.
    # This job varies the seed and sweeps the 3–5% band, so each night is a
    # distinct honest hour towards P4's 500 (docs/11-roadmap.md §P4).
    #
    # ── Why this is a matrix ───────────────────────────────────────────────────
    #
    # The criterion is 500 hours **across all three platforms**, and until this
    # change every runner that could execute the leg was Linux. A Linux-only
    # ledger cannot satisfy the criterion
    # however many hours it holds, which is why `p4-ledger.sh` records a `target`
    # per line and groups `total` on it: the shortfall was visible, and this is
    # what closes it.
    #
    # The per-commit determinism matrix in ci.yml already proves `orrery_core`
    # replays identically on x86_64 Windows and aarch64 macOS. It does **not**
    # build `p1-swarm`, which pulls Bevy (headless: `bevy_app`, `bevy_ecs`,
    # `bevy_math`, `bevy_time`, all `default-features = false`, so no windowing
    # or audio backend is in the tree) and had only ever been built on Linux.
    # Whether it builds on the other two, and whether it produces the *same*
    # numbers there, is what these legs establish. `fail-fast: false` because a
    # platform that cannot hold the hour is a finding about that platform and
    # must not cancel the two that can.
    #
    # ── Cost ──────────────────────────────────────────────────────────────────
    #
    # The leg is a single-threaded simulation: measured at 99% of one core and
    # 108 MB RSS on the box, 9.26 s of CPU for 60 simulated seconds, so ~555 s
    # for the criterion's hour on a Zen 4 core (615 s is the figure measured with
    # two other nightly jobs competing). Every leg is on a hosted runner as of
    # #179, so every leg is slower per core than that and pays a cold build of
    # ~400 crates on a cache miss, which is what the cache below is for.
    # Bounded per platform rather than at one number, and all of them far under
    # the 6-hour job ceiling. The repository is public, so hosted minutes —
    # macOS included — are not billed.
    #
    # Nothing in the leg's verdict depends on the machine, which is what makes
    # the move safe rather than merely affordable: the simulation runs on a
    # simulated clock, and `started_at_unix_secs` — set only by
    # `--stamp-wall-clock` — is deliberately held outside `RunIdentity` as "the
    # one field that makes two runs of the same seed differ". The comparability
    # probe below is the standing proof of that: it requires three platforms'
    # reports to be byte-identical once `identity.target` is stripped.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            # Hosted since #179. The shard name is untouched by that move and
            # must stay untouched: the ledger chain is carried between nights
            # by artifact name, and `run_key` is a hash of the report's
            # `identity` (commit, seed, target triple) with nothing
            # machine-specific in it — so a Linux hour banked on a hosted
            # runner joins the same `x86_64-unknown-linux-gnu` group as every
            # hour banked on the box, and de-duplicates against it.
            runs-on: ubuntu-latest
            # The historical artifact name, kept: it *is* the Linux shard, and
            # renaming it would orphan every hour banked before this change.
            shard: p4-hour-ledger
            # Kept at 45 rather than re-sized, and the measurement is why it is
            # still the right number. Cold and cacheless on `ubuntu-latest`
            # (run 32503887628): **1256 s** for the whole job — 365 s for the
            # build plus the comparability probe, 878 s for the criterion's
            # hour — against 663 s on the box on 2026-08-21 with a warm
            # `target/` and kache. 1.9x slower, 2.15x headroom, and a bound
            # this tight is worth keeping: this leg is a single-threaded
            # simulation with a known cost, so an overrun is a hang and should
            # fail rather than be absorbed.
            timeout: 45
          - platform: windows
            runs-on: windows-latest
            shard: p4-hour-ledger-windows
            timeout: 180
          - platform: macos
            runs-on: macos-latest
            shard: p4-hour-ledger-macos
            timeout: 150
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        # Explicit, because the Windows leg would otherwise get PowerShell and
        # every step here is a POSIX shell script. `bash` on a Windows runner is
        # the Git Bash that ships with the image.
        shell: bash
    # No per-job `env:` any more. It existed to put `RUSTC_WRAPPER: kache` back
    # on the Linux leg only, because that leg ran on the box and the other two
    # did not. All three legs are hosted now, none has kache installed, and the
    # workflow-level clear is the whole of the answer.
    permissions:
      contents: read
      # The ledger is carried between nights as an artifact of this workflow,
      # so the job must read its own previous artifacts. That is the whole of
      # the extra permission this storage choice costs — see the download step.
      actions: read
    steps:
      # Before the checkout, and only on Windows. The runner image sets
      # `core.autocrlf=true`, which would rewrite every `scripts/*.sh` with CRLF
      # line endings; bash then fails on the carriage return in the shebang line
      # and every script in this job dies before its first statement. There is no
      # `.gitattributes` in this repository to prevent it.
      - name: Check out with LF line endings
        if: matrix.platform == 'windows'
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Every leg pays a cold build of the whole dependency graph without this.
      # The guard was `runner.environment == 'github-hosted'`, excluding the
      # Linux leg because it ran on a box with a persistent `target/` and
      # kache; #179 moved that leg here, so the guard is vacuous and gone and
      # the leg simply joins the scheme the other two already use, under its
      # own per-platform key.
      #
      # `p1-swarm/target` stays in the path list, unlike the `ci.yml` lanes
      # #178 moved, and the difference is size: that argument was about a
      # 45.65 GiB workspace `target/` against a 10 GB repository-wide Actions
      # cache allowance. This is one standalone workspace, and the two hosted
      # legs have depended on it every night since the matrix landed —
      # dropping it here would slow them down to make a symmetry point.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            p1-swarm/target
          key: nightly-p4-${{ matrix.platform }}-${{ hashFiles('p1-swarm/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: nightly-p4-${{ matrix.platform }}-

      # These run nowhere else: scripts/check.sh enumerates the four gate
      # self-tests it runs per commit and these two scripts are not gates, so
      # this is the only place a structural regression in them is noticed. On
      # the two hosted legs it is also the first thing that would notice the
      # scripts reaching for a tool the platform does not have — `flock` and
      # `sha256sum` are neither on macOS nor in Git Bash, and both now have
      # fallbacks the self-test checks for.
      - name: Self-test both scripts
        run: |
          scripts/p4-accumulate.sh --self-test
          scripts/p4-ledger.sh --self-test

      # ── The comparability probe ────────────────────────────────────────────
      #
      # Hours banked on three platforms are only worth banking separately if the
      # runs are comparable, and `SwarmReport` makes that question byte-exact:
      # every field in it is computed from the seeded simulation, so two runs of
      # one seed produce identical JSON (measured on the box) and the only field
      # that may legitimately differ across platforms is `identity.target`.
      #
      # Two simulated minutes at the same 32 peers and the same witnessed
      # pipeline, before the hour rather than after: if the harness does not
      # build or does not hold its clauses here, that is the finding, and it
      # costs ~20 s rather than ~10 min to reach it.
      - name: Comparability probe (short fixed-seed run, banks nothing)
        run: scripts/p4-accumulate.sh --probe

      - name: Upload the probe's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-probe-${{ matrix.platform }}
          path: target/p4-accumulate/probe-*.json
          retention-days: 14
          if-no-files-found: warn

      # ── Why the ledger lives in an artifact ────────────────────────────────
      #
      # It has to outlive the runner, and the four candidates cost different
      # things:
      #
      #   * A dedicated branch or an in-repo file needs `contents: write` on a
      #     public repository. That is a token that can rewrite the repository,
      #     handed to a nightly job so that a ledger of player-hours can grow;
      #     the ledger is not worth it. An in-repo file additionally means a
      #     commit every night and a five-way append race. (When this was
      #     written the argument had a second half — the job ran on a box three
      #     CI runners and a developer's own checkout shared, so the token was
      #     also reachable from a machine nothing about the repository
      #     controlled. #179 moved every leg onto ephemeral hosted runners and
      #     that half is gone. The first half stands on its own and is why the
      #     storage choice does not change with the runners.)
      #   * A release asset needs the same write scope, plus a release to hang
      #     it on.
      #   * An artifact needs `actions: read` and a download step, and nothing
      #     else. It is the only option here that grants no write scope at all.
      #
      # What it costs, stated plainly: the chain is only as long as its gaps.
      # Each night restores the whole ledger and re-uploads it, so history
      # survives indefinitely *provided* no retention window passes without a
      # successful run. Retention is set to 90 days below rather than the 14 the
      # sibling jobs use, so recovering from a broken nightly is a matter of
      # months rather than a fortnight — but a 90-day silence still loses every
      # banked hour, and there is no second copy. That is the trade: no write
      # permission anywhere, at the price of a durability floor set by a
      # retention clock. The running total is therefore also written into
      # docs/11-roadmap.md §P4 by hand at each milestone, which is a human
      # checkpoint rather than a backup.
      #
      # One shard per platform, and never one shared artifact: three legs
      # running concurrently cannot append to the same file, and an
      # upload-artifact name is claimed by whichever leg finishes last. The
      # shards are disjoint by construction — `RunIdentity` carries the target
      # triple — and `p4-ledger.sh total` de-duplicates on `run_key` when the
      # comparison job below concatenates them, so a shard restored twice adds
      # nothing.
      - name: Restore this platform's ledger shard
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p target/p4-ledger
          # Newest artifact of this name that has not expired. `// empty` so a
          # first run — or one after a full retention gap — yields nothing and
          # starts a fresh ledger rather than failing.
          id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$SHARD&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "::warning::no unexpired $SHARD artifact; starting a new ledger shard"
            echo "restored=0" >> "$GITHUB_ENV"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > ledger.zip
          # `unzip` rather than python3 would be shorter and is not on every one
          # of these three images; python3 is.
          python3 -c "import sys, zipfile; zipfile.ZipFile('ledger.zip').extractall('target/p4-ledger')"
          rm -f ledger.zip
          lines=$(wc -l < target/p4-ledger/hours.jsonl)
          echo "restored $lines banked run(s) from artifact $id"
          echo "restored=$lines" >> "$GITHUB_ENV"

      - name: Run the accumulation leg and bank its hour
        run: scripts/p4-accumulate.sh

      # The failure this guards is silent and total: a restore that half-worked
      # followed by a successful append uploads a one-line ledger over the whole
      # history, and nothing else would notice. The ledger only ever grows.
      - name: Refuse to publish a shard shorter than the one restored
        run: |
          set -euo pipefail
          now=$(wc -l < target/p4-ledger/hours.jsonl)
          if [ "$now" -lt "${restored:-0}" ]; then
            echo "::error::ledger shrank from ${restored:-0} to $now lines; refusing to publish it"
            exit 1
          fi
          echo "shard holds $now banked run(s) (restored ${restored:-0})"
          {
            echo "### P4 player-hour ledger — ${{ matrix.platform }} shard"
            echo '```'
            scripts/p4-ledger.sh total 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Always: a leg that failed banked nothing, and the shard in hand is
      # still the one the next night must inherit. Not re-uploading it would
      # make a single failed night the start of the retention clock on
      # everything before it.
      - name: Publish this platform's shard for the next night
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.shard }}
          path: target/p4-ledger/hours.jsonl
          retention-days: 90
          if-no-files-found: warn

      - name: Upload the leg's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-accumulate-evidence-${{ matrix.platform }}
          path: target/p4-accumulate/
          retention-days: 14
          if-no-files-found: warn

  p4-platform-ledger:
    name: P4 cross-platform comparison and combined ledger
    # `always()`: the interesting case is precisely the one where a platform leg
    # failed. Two probes that agree and a third leg that did not build is the
    # finding this job exists to report, and a `needs` that skipped on failure
    # would swallow it.
    needs: p4-accumulate
    if: always()
    # Hosted since #179. This job compiles nothing and runs no harness: it
    # downloads the three legs' artifacts and reduces them with `jq`, `diff`
    # and `scripts/p4-ledger.sh`. It was on the box only because the box was
    # the default here, and it is the cheapest of the five to move.
    #
    # It needs the checkout only for `scripts/p4-ledger.sh` itself: `total`
    # groups on the `pipeline` digest each line already carries and never
    # re-derives one, so the shallow checkout that cannot resolve a banked
    # line's older commit is not a problem here. `append`, which does derive
    # a digest, runs in the accumulation legs against their own `HEAD`.
    runs-on: ubuntu-latest
    # Untouched at 20 minutes: 15 s on the box on 2026-08-21 (run 32442955806),
    # and **11 s** for a hosted replica of the download and both reduction steps
    # against three probe artifacts (run 32507043296). 109x headroom. The bound
    # exists so a wedged artifact download fails the job instead of hanging
    # until the ceiling, and nothing about that changes with the runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Collect every probe report
        uses: actions/download-artifact@v7
        with:
          pattern: p4-probe-*
          path: probes

      - name: Collect every ledger shard
        uses: actions/download-artifact@v7
        with:
          pattern: p4-hour-ledger*
          path: shards

      # ── Are the platforms comparable? ──────────────────────────────────────
      #
      # The probe ran the same seed, the same population and the same impairment
      # on every platform that got that far, with no wall-clock stamp, so the
      # reports are pure functions of their parameters. `identity.target` is the
      # one field that may differ. Everything else differing is a cross-platform
      # divergence in the simulation — which is exactly the class of defect D9's
      # apparatus exists to prevent, and a reason to stop banking hours on the
      # platform that disagrees rather than a reason to loosen the comparison.
      #
      # One caveat this job cannot close, and it belongs on the record: within a
      # single run every peer shares one binary and one `libm`, so a run on
      # Windows proves the pipeline holds *on Windows*. It does not exercise a
      # witness on one platform re-executing a subject's log from another. That
      # is a different experiment (p1-swarm's module docs name it) and the
      # criterion's "across all three platforms" is not obviously the same claim.
      - name: Require every platform's probe to agree
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(probes/*/probe-*.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::no probe reports at all; no platform got as far as running one"
            exit 1
          fi
          echo "### P4 cross-platform comparability probe" >> "$GITHUB_STEP_SUMMARY"
          # `identity.target` is stripped, and nothing else is. A second field
          # ever needing to be stripped is a finding to write down, not a line
          # to add here quietly.
          strip() { jq -S 'del(.identity.target)' "$1"; }
          reference=${reports[0]}
          status=0
          {
            echo '```'
            echo "reference: $(jq -r '.identity.target' "$reference")"
          } >> "$GITHUB_STEP_SUMMARY"
          for report in "${reports[@]}"; do
            target=$(jq -r '.identity.target' "$report")
            if diff -q <(strip "$reference") <(strip "$report") >/dev/null; then
              echo "  $target: identical to the reference" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  $target: DIVERGES from the reference" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$target diverges from $(jq -r '.identity.target' "$reference") on the same seed"
              diff <(strip "$reference") <(strip "$report") | head -60 || true
              status=1
            fi
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ ${#reports[@]} -lt 3 ]; then
            echo "::warning::only ${#reports[@]} of 3 platforms produced a probe report"
          fi
          exit "$status"

      # The shards are disjoint by target and `total` de-duplicates on
      # `run_key`, so concatenating them is the whole of the merge.
      - name: Total the ledger across every platform
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p target/p4-ledger
          shards=(shards/*/hours.jsonl)
          if [ ${#shards[@]} -eq 0 ]; then
            echo "::warning::no ledger shards; nothing has banked yet"
            exit 0
          fi
          cat "${shards[@]}" > target/p4-ledger/hours.jsonl
          {
            echo '### P4 player-hour ledger — all platforms'
            echo '```'
            scripts/p4-ledger.sh total 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/p4-ledger.sh total

      # The combined view is derived and could be rebuilt from the shards, but a
      # reader chasing "how many hours does P4 have" should not have to.
      - name: Upload the combined ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-hour-ledger-combined
          path: target/p4-ledger/hours.jsonl
          retention-days: 90
          if-no-files-found: warn

  p3-island:
    name: P3 island gate (kill -9, 8 peers)
    # No cluster and no fixed port: every listener in scripts/p3-island-gate.sh
    # binds 127.0.0.1:0 and persistd runs with --allow-volatile-leases, so this
    # gate needs nothing a runner does not already have.
    #
    # ── Moved to a hosted runner by #180, once #236 made it portable ────────
    #
    # This job was the final workload migrated to a hosted runner, and the reason was
    # the drain leg #168 added: it required every lease held at drain start to
    # be *parked* at one observation instant. On a 4-vCPU hosted runner peers
    # leave the island at different enough rates that 378 of 400 leases found a
    # live successor and were reassigned on the way out instead — correct D7
    # behaviour that the leg counted as failure. It also passed on the box by
    # 4 ms (10 996 against an 11 000 ms budget), which was the tell: a gate with
    # 0.04 % of headroom is measuring the machine.
    #
    # #236 replaced that timing verdict with an invariant — every lease
    # accounted for through reassignment *or* parking, nothing outstanding,
    # counters quiescent, `duplicate_authority` 0 — so a reassigned-then-parked
    # lease is now accounted for rather than failed. The leg no longer depends
    # on peer-departure ordering, and nothing here needs the box: no
    # FoundationDB, no D19 device qualification, no journal, and three
    # processes.
    #
    # The cost of moving is 174 s on the box against 407 s hosted, once a night:
    # about 1.2 hours a year, and $0, because hosted minutes are free on a
    # public repository. The `actions/cache` step below stops being dead code
    # and starts being the thing that keeps that number down.
    runs-on: ubuntu-latest
    # The harness runs a 30 s island plus setup and teardown; the build
    # dominates. Bounded so a hung peer fails rather than burning the job limit.
    # 174 s on the box on 2026-08-21 (run 32442955806).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: nightly-p3-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: nightly-p3-

      # Release binaries: the criterion is about what the registrar does inside
      # a 10 s lease TTL, and debug builds change the timing enough to make a
      # pass or a failure mean something different.
      - name: Build the harness binaries
        run: cargo build --release -p orrery_persistd -p orrery_coordinator

      - name: Build the island harness
        working-directory: p3-island
        run: cargo build --release

      # No FoundationDB here on purpose. Authority lives in the registrar, and
      # the criterion is about what happens when a holder dies, so the volatile
      # lease store is the honest configuration (see the script's header).
      #
      # Two runs, because the criterion has two halves and one run only ever
      # exercises one of them. `P3_VICTIM_CLAIM_KIND` decides which: the weak
      # leg's rows are *redistributed* to survivors, the strong leg's *park*
      # and stay reserved for the peer that died (D7 §5, §4.3). Only the weak
      # leg ran here until #129, and the strong leg had been unpassable for
      # months without anything noticing — every correctly parked row was
      # reported lost. The 30 s island is nothing beside the build above; an
      # unrun leg costs far more (AGENTS.md §A `--self-test` nothing runs is
      # not a check).
      - name: Run the island gate (weak claims — the redistribution half)
        env:
          PERSISTD_BIN: ${{ github.workspace }}/target/release/persistd
          COORDINATOR_BIN: ${{ github.workspace }}/target/release/orrery-coordinator
          P3_ISLAND_BIN: ${{ github.workspace }}/p3-island/target/release/p3-island
          P3_VICTIM_CLAIM_KIND: weak
        run: scripts/p3-island-gate.sh

      # Runs even when the weak leg failed, so one red leg does not hide the
      # other's verdict: they fail for different reasons and both answers are
      # wanted. `!cancelled()` rather than `always()` — a cancelled job should
      # stop, and a build failure earlier in the job surfaces here as the
      # script's own "not an executable" refusal rather than as a mystery.
      # The default output directory is `p3-island-<utc stamp>`, so the two
      # runs land in two directories and both are uploaded below; which leg a
      # directory holds is recorded inside its own `report.json`.
      - name: Run the island gate (strong claims — the parking half)
        if: ${{ !cancelled() }}
        env:
          PERSISTD_BIN: ${{ github.workspace }}/target/release/persistd
          COORDINATOR_BIN: ${{ github.workspace }}/target/release/orrery-coordinator
          P3_ISLAND_BIN: ${{ github.workspace }}/p3-island/target/release/p3-island
          P3_VICTIM_CLAIM_KIND: strong
        run: scripts/p3-island-gate.sh

      - name: Upload the gate's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p3-island-evidence
          path: p3-island-*/
          retention-days: 14
          if-no-files-found: warn

  p3-siblings:
    name: P3 sibling gateways (two persistd, disjoint shards, FoundationDB)
    # Hosted, and for the same reason `p2-kill9` is: this gate seeds a durable
    # world and activates two shard sets against the fence, so it consumes its
    # cluster. Provisioning a throwaway one means `sudo dpkg -i` on the server
    # package, which the box's unprivileged `ci` user could not do — and the
    # cluster that box *did* run is a shared development database this gate
    # must never be pointed at. #179 moved the rest of this file here too, so
    # "hosted" is now the default rather than this job's exception; the
    # cluster argument is still the reason it could never have been anywhere
    # else.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # #171's free-disk sampler, record-only: sample free bytes on / every
      # 2 s for the life of the job and report the minimum at the end. A
      # snapshot at start misses the peak and one at the end understates it;
      # the sampled minimum is the figure comparable to #171's "free at peak"
      # column. Same loop `clippy` has run since #194. It asserts nothing, so
      # unlike a threshold guard it cannot fire for the wrong reason.
      - name: Start the free-disk sampler
        run: |
          set -euo pipefail
          nohup bash -c 'while :; do df -B1 --output=avail / | tail -1; sleep 2; done' \
            > "$RUNNER_TEMP/avail.txt" 2>/dev/null &
          echo "sampling free bytes on / every 2 s into $RUNNER_TEMP/avail.txt"
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: nightly-p3s-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: nightly-p3s-

      # Two live gateways must share one durable fence and one lease tier, so
      # unlike the P3 island gate this one cannot run without a server.
      - name: Install FoundationDB with a local cluster
        uses: ./.github/actions/foundationdb
        with:
          server: "true"

      # Release binaries: both criteria are about what a registrar does inside
      # a 10 s lease TTL, and debug builds change the timing enough to make a
      # pass or a failure mean something different.
      - name: Build the fdb-enabled binaries
        run: |
          set -euo pipefail
          cargo build --release -p orrery_persistd --features fdb
          cargo build --release -p orrery_seed --features orrery_seed/fdb
          cargo build --release -p orrery_coordinator

      - name: Build the sibling harness
        working-directory: p3-siblings
        run: cargo build --release

      - name: Run the sibling-gateway gate
        env:
          ORRERY_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
          PERSISTD_BIN: ${{ github.workspace }}/target/release/persistd
          COORDINATOR_BIN: ${{ github.workspace }}/target/release/orrery-coordinator
          ORRERY_SEED_BIN: ${{ github.workspace }}/target/release/orrery-seed
          P3_SIBLINGS_BIN: ${{ github.workspace }}/p3-siblings/target/release/p3-siblings
        run: scripts/p3-siblings-gate.sh

      - name: Upload the gate's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p3-siblings-evidence
          path: p3-siblings-*/
          retention-days: 14
          if-no-files-found: warn

      - name: Disk report
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Free disk at peak'
            echo '```'
            df -h /
            if [[ -s "${RUNNER_TEMP:-}/avail.txt" ]]; then
              echo "min_free_bytes     $(sort -n "${RUNNER_TEMP:-}/avail.txt" | head -1)"
              echo "df_samples         $(wc -l < "${RUNNER_TEMP:-}/avail.txt")"
            else
              echo 'no samples collected'
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"


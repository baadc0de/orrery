# The phase gates that need real processes, real crashes and a real cluster.
#
# P2's kill-9 harness and P3's island harness are proof harnesses: neither
# writes a success artifact unless every clause of its phase's demo criterion
# holds. That makes them slow and stateful — eight peers, a 10 s lease TTL, a
# FoundationDB cluster — so they cannot gate a pull request. They run here
# instead, nightly and on demand, which is the "kept green in CI thereafter"
# half of the roadmap's demo-or-it-didn't-happen rule (docs/11-roadmap.md
# §Sequencing principle 3).
#
# Their `--self-test` modes run per-commit in ci.yml; those check the scripts
# still contain the stages that make them proofs, not that the proofs pass.

# ── Where these run ──────────────────────────────────────────────────────────
#
# Nightly fires on a schedule and on workflow_dispatch, never on a pull request,
# so the fork-PR problem that constrains ci.yml does not exist here and the
# self-hosted box is unconditionally safe to use.
#
# The two jobs that need a FoundationDB cluster stay on GitHub-hosted runners,
# and the reason is now the accurate one. It is not `scripts/fdb-dev.sh`, which
# takes its port and data directory from the environment
# (`ORRERY_FDB_DEV_PORT`, `ORRERY_FDB_DEV_DIR`) and no longer stops anything by
# port; and `scripts/p2-kill9-gate.sh` never called that harness in the first
# place — it reads `ORRERY_FDB_CLUSTER_FILE` and nothing else. It is that
# provisioning a throwaway cluster means `sudo dpkg -i` on the server package,
# and the self-hosted runner is an unprivileged `ci` user with no sudo. The box
# does run an `fdbserver`, and that is precisely the cluster these jobs must
# not touch: it is a shared development database, and both of them write to
# whatever cluster they are pointed at (docs/11-roadmap.md, C-8).
#
# `p3-island` was pinned here for the same stated reason and never had one:
# `scripts/p3-island-gate.sh` contains no FoundationDB reference at all, runs
# persistd with `--allow-volatile-leases`, and binds every listener on
# `127.0.0.1:0`. Nothing in it collides with anything, so it runs on the box.

name: Nightly gates

on:
  schedule:
    # 03:00 UTC daily. Nothing depends on the hour; it is off-peak for runners.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  CARGO_INCREMENTAL: 0

jobs:
  p1-swarm:
    name: P1 swarm gate (32 peers, one simulated hour, clean + impaired)
    # Simulated hour, no cluster, no ports: 16 cores and a warm target/ turn this from tens of minutes into a few.
    runs-on: [self-hosted, orrery-hel1]
    env:
      # Overrides the workflow-level clear: the box has a persistent sccache at
      # /var/cache/sccache, shared with the dev checkout on the same machine.
      RUSTC_WRAPPER: sccache
    # Two simulated hours take about five minutes of wall clock — the hour is
    # simulated, so it costs what it costs to compute. The build dominates.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Bevy's Linux build dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      - name: Run the swarm gate
        run: scripts/p1-swarm-gate.sh

      - name: Upload the gate's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p1-swarm-evidence
          path: target/p1-swarm/
          if-no-files-found: warn

  p3-island:
    name: P3 island gate (kill -9, 8 peers)
    # No cluster and no fixed port: every listener in scripts/p3-island-gate.sh
    # binds 127.0.0.1:0 and persistd runs with --allow-volatile-leases, so this
    # gate collides with nothing the box is already doing.
    runs-on: [self-hosted, orrery-hel1]
    env:
      # Overrides the workflow-level clear: the box has a persistent sccache at
      # /var/cache/sccache, shared with the dev checkout on the same machine.
      RUSTC_WRAPPER: sccache
    # The harness runs a 30 s island plus setup and teardown; the build
    # dominates. Bounded so a hung peer fails rather than burning the job limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        # The box keeps its target/ between runs; a cache round-trip would cost
        # more than it saves there.
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: nightly-p3-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: nightly-p3-

      # Release binaries: the criterion is about what the registrar does inside
      # a 10 s lease TTL, and debug builds change the timing enough to make a
      # pass or a failure mean something different.
      - name: Build the harness binaries
        run: cargo build --release -p orrery_persistd -p orrery_coordinator

      - name: Build the island harness
        working-directory: p3-island
        run: cargo build --release

      # No FoundationDB here on purpose. Authority lives in the registrar, and
      # the criterion is about what happens when a holder dies, so the volatile
      # lease store is the honest configuration (see the script's header).
      - name: Run the island gate
        env:
          PERSISTD_BIN: ${{ github.workspace }}/target/release/persistd
          COORDINATOR_BIN: ${{ github.workspace }}/target/release/orrery-coordinator
          P3_ISLAND_BIN: ${{ github.workspace }}/p3-island/target/release/p3-island
        run: scripts/p3-island-gate.sh

      - name: Upload the gate's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p3-island-evidence
          path: p3-island-*/
          retention-days: 14
          if-no-files-found: warn

  p2-kill9:
    name: P2 kill-9 gate (FoundationDB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: nightly-p2-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: nightly-p2-

      # FoundationDB 7.3.x per D11/D14: the client provides libfdb_c and the
      # headers orrery_persistd links under the `fdb` feature, the server the
      # single-node cluster the gate writes to.
      - name: Install FoundationDB with a local cluster
        uses: ./.github/actions/foundationdb
        with:
          server: "true"

      - name: Build the fdb-enabled binaries
        run: cargo build --release -p orrery_persistd --features fdb

      - name: Build the load rig and dashboard
        run: |
          set -euo pipefail
          # p2-load and p2-dashboard carry their own [workspace] tables and are
          # excluded from the root workspace, so each builds on its own.
          (cd p2-load && cargo build --release)
          (cd p2-dashboard && cargo build --release)

      - name: Run the kill-9 gate
        env:
          ORRERY_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
          PERSISTD_BIN: ${{ github.workspace }}/target/release/persistd
          P2_LOAD_BIN: ${{ github.workspace }}/p2-load/target/release/p2-load
          P2_DASHBOARD_BIN: ${{ github.workspace }}/p2-dashboard/target/release/p2-dashboard
        run: scripts/p2-kill9-gate.sh

      - name: Upload the gate's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p2-kill9-evidence
          path: p2-kill9-*/
          retention-days: 14
          if-no-files-found: warn

  determinism-soak:
    name: determinism soak (extended corpus)
    # Ten corpus repeats in one process. Bevy-free and cheap, but it still paid a cold build every night.
    runs-on: [self-hosted, orrery-hel1]
    env:
      # Overrides the workflow-level clear: the box has a persistent sccache at
      # /var/cache/sccache, shared with the dev checkout on the same machine.
      RUSTC_WRAPPER: sccache
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The per-commit matrix runs the corpus once per platform. Repeating it
      # in one process targets a different failure: VC-4 and VC-8 violations
      # (hash iteration order, address hashing) are per-*process* nondeterminism
      # and can hide behind a corpus that happens to agree on one run.
      - name: Repeat the corpus and require identical digests
        run: |
          set -euo pipefail
          cargo build --release -p orrery_conformance
          bin=target/release/orrery-conformance
          "$bin" emit --out /tmp/soak-0.json --compact
          for i in $(seq 1 9); do
            "$bin" emit --out "/tmp/soak-$i.json" --compact
            # `target` is the only field allowed to differ between reports, and
            # it cannot differ here — same binary, same machine. A plain diff is
            # the strictest check available.
            if ! diff -q /tmp/soak-0.json "/tmp/soak-$i.json" >/dev/null; then
              echo "::error::run $i differs from run 0 — a per-process nondeterminism (VC-4/VC-8)"
              diff /tmp/soak-0.json "/tmp/soak-$i.json" || true
              exit 1
            fi
          done
          echo "10 runs produced byte-identical digests"

      # The three sibling jobs all upload theirs. A soak that fails on run 7 of
      # 10 is diagnosed from the two digests that disagree, and without this
      # they die with the runner.
      - name: Upload the soak's digests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: determinism-soak-digests
          path: /tmp/soak-*.json
          retention-days: 14
          if-no-files-found: warn

  fdb-tests:
    name: fdb-gated tests (persistd + seed, against a real cluster)
    # A throwaway single-node cluster, provisioned by the composite action and
    # discarded with the runner. Never the box's development cluster: these
    # suites write into whatever cluster they are given, at fixed keys, and
    # `orrery_seed`'s gates wipe key ranges outright.
    runs-on: ubuntu-latest
    # The build dominates; the tests themselves are seconds against a local
    # single-node cluster.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: nightly-fdb-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: nightly-fdb-

      - name: Install FoundationDB with a local cluster
        uses: ./.github/actions/foundationdb
        with:
          server: "true"

      # The reason this goes through a wrapper script rather than a plain
      # `cargo test --features fdb`: that command passes here whether or not
      # the cluster exists. Twenty-two guards inside these suites
      # `eprintln!("skipping: …")` and return `Ok` when they cannot find one,
      # so the naive job is green on an unreachable cluster.
      # `scripts/fdb-tests.sh` captures stderr, fails on any skip, and asserts
      # a floor on the number of tests that actually executed — see its header.
      #
      # Both packages in one invocation, per C-8 (docs/11-roadmap.md): the bug
      # that entry records passed when the suites were run separately and
      # failed when they were run together, so running them apart would stop
      # testing for its return.
      - name: Run the fdb-gated suite
        env:
          ORRERY_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
        run: scripts/fdb-tests.sh

      - name: Upload the run's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdb-tests-log
          path: target/fdb-tests.log
          retention-days: 14
          if-no-files-found: warn

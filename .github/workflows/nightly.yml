  p2-kill9:
    name: P2 kill-9 gate (FoundationDB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # #171's free-disk sampler, record-only — same loop as the other FDB
      # jobs in this file; see the note on `p3-siblings`.
      - name: Start the free-disk sampler
        run: |
          set -euo pipefail
          nohup bash -c 'while :; do df -B1 --output=avail / | tail -1; sleep 2; done' \
            > "$RUNNER_TEMP/avail.txt" 2>/dev/null &
          echo "sampling free bytes on / every 2 s into $RUNNER_TEMP/avail.txt"
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: nightly-p2-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: nightly-p2-

      # FoundationDB 7.3.x per D11/D14: the client provides libfdb_c and the
      # headers orrery_persistd links under the `fdb` feature, the server the
      # single-node cluster the gate writes to.
      - name: Install FoundationDB with a local cluster
        uses: ./.github/actions/foundationdb
        with:
          server: "true"

      # `orrery-seed` seeds the durable world the gate then writes to, and the
      # gate's tool check requires the binary before it does anything at all —
      # so it is built here, not left to the gate to discover missing. Its
      # `fdb` feature is what compiles `apply`/`verify` (the `plan` verb needs
      # no C client), and the feature is spelled `orrery_seed/fdb` because
      # `-p` selects the package while `--features` resolves against the
      # workspace root.
      - name: Build the fdb-enabled binaries
        run: |
          set -euo pipefail
          cargo build --release -p orrery_persistd --features fdb
          cargo build --release -p orrery_seed --features orrery_seed/fdb

      - name: Build the load rig and dashboard
        run: |
          set -euo pipefail
          # p2-load and p2-dashboard carry their own [workspace] tables and are
          # excluded from the root workspace, so each builds on its own.
          (cd p2-load && cargo build --release)
          (cd p2-dashboard && cargo build --release)

      - name: Run the kill-9 gate
        env:
          ORRERY_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
          PERSISTD_BIN: ${{ github.workspace }}/target/release/persistd
          P2_LOAD_BIN: ${{ github.workspace }}/p2-load/target/release/p2-load
          P2_DASHBOARD_BIN: ${{ github.workspace }}/p2-dashboard/target/release/p2-dashboard
          ORRERY_SEED_BIN: ${{ github.workspace }}/target/release/orrery-seed
        run: scripts/p2-kill9-gate.sh

      - name: Upload the gate's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p2-kill9-evidence
          path: p2-kill9-*/
          retention-days: 14
          if-no-files-found: warn

      - name: Disk report
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Free disk at peak'
            echo '```'
            df -h /
            if [[ -s "${RUNNER_TEMP:-}/avail.txt" ]]; then
              echo "min_free_bytes     $(sort -n "${RUNNER_TEMP:-}/avail.txt" | head -1)"
              echo "df_samples         $(wc -l < "${RUNNER_TEMP:-}/avail.txt")"
            else
              echo 'no samples collected'
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  determinism-soak:
    name: determinism soak (extended corpus)
    # Ten corpus repeats in one process, against one Bevy-free crate whose
    # dependency list is deliberately tiny (`orrery_conformance` takes no
    # tokio, no OS services and no clock, so that it builds identically on
    # every target in the determinism matrix). That is why it is the cheapest
    # job in this file and the one the box bought the least for.
    #
    # Hosted since #179, and the cheapest move in the file: the whole job took
    # **44 s** cold and cacheless on `ubuntu-latest` (30 s of it the build and
    # the ten repeats together), against 18 s on the box with a warm `target/`
    # and kache. 26 seconds is the entire price of not owning a machine.
    runs-on: ubuntu-latest
    # Untouched at 30 minutes: 41x the measured wall-clock. The bound is here
    # so a per-process nondeterminism that manifests as a hang fails the job
    # rather than burning the ceiling, and it does not need re-sizing for a
    # 44 s job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The per-commit matrix runs the corpus once per platform. Repeating it
      # in one process targets a different failure: VC-4 and VC-8 violations
      # (hash iteration order, address hashing) are per-*process* nondeterminism
      # and can hide behind a corpus that happens to agree on one run.
      - name: Repeat the corpus and require identical digests
        run: |
          set -euo pipefail
          cargo build --release -p orrery_conformance
          bin=target/release/orrery-conformance
          "$bin" emit --out /tmp/soak-0.json --compact
          for i in $(seq 1 9); do
            "$bin" emit --out "/tmp/soak-$i.json" --compact
            # `target` is the only field allowed to differ between reports, and
            # it cannot differ here — same binary, same machine. A plain diff is
            # the strictest check available.
            if ! diff -q /tmp/soak-0.json "/tmp/soak-$i.json" >/dev/null; then
              echo "::error::run $i differs from run 0 — a per-process nondeterminism (VC-4/VC-8)"
              diff /tmp/soak-0.json "/tmp/soak-$i.json" || true
              exit 1
            fi
          done
          echo "10 runs produced byte-identical digests"

      # The three sibling jobs all upload theirs. A soak that fails on run 7 of
      # 10 is diagnosed from the two digests that disagree, and without this
      # they die with the runner.
      - name: Upload the soak's digests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: determinism-soak-digests
          path: /tmp/soak-*.json
          retention-days: 14
          if-no-files-found: warn

  fdb-tests:
    name: fdb-gated tests (persistd + seed, against a real cluster)
    # A throwaway single-node cluster, provisioned by the composite action and
    # discarded with the runner. Never the box's development cluster: these
    # suites write into whatever cluster they are given, at fixed keys, and
    # `orrery_seed`'s gates wipe key ranges outright.
    runs-on: ubuntu-latest
    # The build dominates; the tests themselves are seconds against a local
    # single-node cluster.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # #171's free-disk sampler, record-only — same loop as the other FDB
      # jobs in this file; see the note on `p3-siblings`.
      - name: Start the free-disk sampler
        run: |
          set -euo pipefail
          nohup bash -c 'while :; do df -B1 --output=avail / | tail -1; sleep 2; done' \
            > "$RUNNER_TEMP/avail.txt" 2>/dev/null &
          echo "sampling free bytes on / every 2 s into $RUNNER_TEMP/avail.txt"
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: nightly-fdb-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: nightly-fdb-

      - name: Install FoundationDB with a local cluster
        uses: ./.github/actions/foundationdb
        with:
          server: "true"

      # The reason this goes through a wrapper script rather than a plain
      # `cargo test --features fdb`: that command passes here whether or not
      # the cluster exists. Twenty-two guards inside these suites
      # `eprintln!("skipping: …")` and return `Ok` when they cannot find one,
      # so the naive job is green on an unreachable cluster.
      # `scripts/fdb-tests.sh` captures stderr, fails on any skip, and asserts
      # a floor on the number of tests that actually executed — see its header.
      #
      # Both packages in one invocation, per C-8 (docs/11-roadmap.md): the bug
      # that entry records passed when the suites were run separately and
      # failed when they were run together, so running them apart would stop
      # testing for its return.
      - name: Run the fdb-gated suite
        env:
          ORRERY_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
        run: scripts/fdb-tests.sh

      - name: Upload the run's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdb-tests-log
          path: target/fdb-tests.log
          retention-days: 14
          if-no-files-found: warn

      - name: Disk report
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Free disk at peak'
            echo '```'
            df -h /
            if [[ -s "${RUNNER_TEMP:-}/avail.txt" ]]; then
              echo "min_free_bytes     $(sort -n "${RUNNER_TEMP:-}/avail.txt" | head -1)"
              echo "df_samples         $(wc -l < "${RUNNER_TEMP:-}/avail.txt")"
            else
              echo 'no samples collected'
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

[package]
name = "p3-siblings"
version = "0.1.0"
edition = "2021"
description = "Two sibling persistd gateways over disjoint shards: the reassign-or-park proof and the single-writer invariant, summed over both registrars"
license = "MIT"

# Standalone tool, following the `p3-island` and `p2-load` precedent: it dials
# the real gateway wire surface over raw iroh rather than running the Bevy
# client stack, and its peers are real OS processes so a `kill -9` is a real
# SIGKILL. Declaring its own `[workspace]` means `cargo test --workspace` at the
# repository root reaches none of it, which is why it has a row in
# `scripts/check.sh`'s lane table and in AGENTS.md's workspace inventory —
# `check.sh --self-test` fails on a workspace no lane visits.
[workspace]

[[bin]]
name = "p3-siblings"
path = "src/main.rs"

[dependencies]
orrery_protocol = { path = "../crates/orrery_protocol" }
# Interest grants come from a live coordinator rather than being minted here: a
# fixture that signs its own authorization proves nothing about the path
# production uses.
orrery_coordinator = { path = "../crates/orrery_coordinator" }
# The durable ledger the double-spend race is decided in (issue #152, D11 §7).
# Taken as a dependency rather than re-spelled here: `ledger/item/{uid}`'s key
# layout, its postcard-encoded `ItemRow`, the receipt row and the 40-byte
# transfer `args` are all *durable* encodings, and a harness carrying a second
# copy of them would keep compiling after the cluster's own layout moved and
# would then assert confidently about the wrong bytes. The `p2-load` rig takes
# the same dependency for the same reason (`p2-load/Cargo.toml`).
orrery_persistd = { path = "../crates/orrery_persistd", features = ["fdb"] }
foundationdb = { version = "0.11", default-features = false, features = ["fdb-7_3"] }
# Versions mirror the root workspace's D14 pins exactly (a standalone
# `[workspace]` cannot inherit `workspace.dependencies`).
iroh = "1.0.3"
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
data-encoding = "2"

[package]
name = "orrery_regolith_client"
version = "0.1.0"
edition = "2021"
description = "The Bevy 0.19 visual and keyboard skin for Orrery Regolith"
license = "MIT OR Apache-2.0"

[workspace]
resolver = "2"

[dependencies]
bevy = "0.19"
orrery_core = { path = "../../crates/orrery_core" }
orrery_games = { path = "../../crates/orrery_games" }
orrery_predict = { path = "../../crates/orrery_predict" }
orrery_protocol = { path = "../../crates/orrery_protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# Transport pins mirror p1-swarm's exactly (D14): the client is the second
# process on that harness's exterior wire and must not drift versions.
iroh = "1.0.3"
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }

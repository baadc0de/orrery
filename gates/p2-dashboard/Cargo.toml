[package]
name = "p2-dashboard"
version = "0.1.0"
edition = "2021"
description = "P2 latency gate: consumes gates/p2-load JSONL telemetry, reports p50/p99/max per D16 series, exits non-zero when any p99 misses its target"
license = "MIT"

# Standalone tool (the gates/p0-dashboard precedent), but reusing the workspace's
# pinned deps so both sides of the JSONL contract agree on one serde/clap
# version, and sharing the D16 histogram with the client that produces the
# stream: percentiles are computed by the same code that the gate reports.
[workspace]

[[bin]]
name = "p2-dashboard"
path = "src/main.rs"

[dependencies]
orrery_persist_client = { path = "../../crates/orrery_persist_client" }
# Versions mirror the root workspace's D14 pins exactly (a standalone
# `[workspace]` cannot inherit `workspace.dependencies`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

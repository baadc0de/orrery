[package]
name = "p3-island"
version = "0.1.0"
edition = "2021"
description = "P3 authority harness: an 8-peer island with contested entities, a kill -9, and the reassign-or-park proof the phase gate requires"
license = "MIT"

# Standalone tool, following the `gates/p2-load` precedent: it dials the real gateway
# wire surface over raw iroh rather than running the Bevy client stack, because
# the property under test is what the *registrar* does when a peer dies. Peers
# are real OS processes so `kill -9` is a real SIGKILL, not a dropped task.
[workspace]

[[bin]]
name = "p3-island"
path = "src/main.rs"

[dependencies]
orrery_protocol = { path = "../../crates/orrery_protocol" }
# The harness gets its interest grants from a live coordinator rather than
# minting them: a fixture that signs its own authorization proves nothing about
# the path production uses.
orrery_coordinator = { path = "../../crates/orrery_coordinator" }
# Versions mirror the root workspace's D14 pins exactly (a standalone
# `[workspace]` cannot inherit `workspace.dependencies`).
iroh = "1.0.3"
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
data-encoding = "2"

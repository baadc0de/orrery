[package]
name = "p0-dashboard"
version = "0.1.0"
edition = "2021"
description = "P0 punch-rate dashboard: aggregates gates/p0-nat-test --json soak telemetry against the iroh ~90% direct / ~95% direct-bytes baseline"
license = "MIT"

# Standalone tool: not part of the orrery workspace (which pins D14 versions
# for the netcode stack). Consumes the JSONL emitted by gates/p0-nat-test --json.
[workspace]

[[bin]]
name = "p0-dashboard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

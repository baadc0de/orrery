[package]
name = "p4-streams-bench"
version = "0.1.0"
edition = "2021"
description = "P4 transport benchmark: what a shared control stream, a stream per message, and the datagram status quo each cost the repair path under loss"
license = "MIT"

# Standalone tool, following the `gates/p3-island` and `gates/p1-swarm` precedent. Unlike
# `gates/p1-swarm` this one may *not* simulate the link: the property under test is
# QUIC's own stream scheduling — which stream's loss blocks which message — and
# a hand-written model of that would be the thing being measured. So the peers
# are real `aeronet_iroh` sessions over real QUIC, and only the wire underneath
# them is impaired, by a UDP proxy this tool runs itself.
[workspace]

[[bin]]
name = "p4-streams-bench"
path = "src/main.rs"

[dependencies]
orrery_net = { path = "../../crates/orrery_net" }
orrery_protocol = { path = "../../crates/orrery_protocol" }
# Versions mirror the root workspace's D14 pins exactly (a standalone
# `[workspace]` cannot inherit `workspace.dependencies`).
aeronet_io = "0.21"
aeronet_iroh = { path = "../../vendor/aeronet_iroh" }
bevy_app = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false }
bevy_platform = { version = "0.19", default-features = false, features = ["std"] }
bevy_time = { version = "0.19", default-features = false }
# `unstable-custom-transports` is what lets the impairment live inside the
# stack rather than beside it — see `src/impaired.rs` for why beside it does
# not work. A feature, not a version bump, and this tool has its own workspace,
# so nothing in the D14 pin set moves.
iroh = { version = "1.0.3", features = ["unstable-custom-transports"] }
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }
n0-watcher = "1.0"
noq-udp = "1.1.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

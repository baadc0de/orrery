[package]
name = "orrery_identity"
version = "0.1.0"
edition = "2021"
description = "Orrery identity service: account store, NodeId binding, session-token issuance, refresh, and issuer-key rotation (D12, D31)"
license = "MIT OR Apache-2.0"

# Bevy-free service crate (D15), the first row of D12's service table. It owns
# the write half of the `id/` subspace D31 specifies and the issuing half of the
# session token `orrery_protocol::identity` already verifies.
#
# A root workspace member, deliberately: the thirteen-workspace table in
# docs/ci-and-gates.md and `scripts/check.sh --self-test` police standalone
# `[workspace]` tables, and a fourteenth workspace fails that gate by design.
[features]
default = []
# FoundationDB-backed account store over D31's `d` family. Links the C client
# (`libfdb_c`); the default build needs none, which is the same posture
# `orrery_persistd` and `orrery_seed` keep. Tests that need a live cluster are
# compiled here and self-skip when no cluster is reachable.
fdb = ["dep:foundationdb", "orrery_persistd/fdb"]

[dependencies]
orrery_protocol = { path = "../orrery_protocol" }
# For `keyspace`: #209 landed D31's `da`/`db`/`dh` key builders and row types in
# persistd, and for `gateway::BindingAuthority`, the seam this crate's store
# answers. Same direction and the same reason `orrery_seed` depends on it —
# persistd owns the keyspace module, and a second copy of those bytes is the
# one thing D31 clause (b) cannot survive.
orrery_persistd = { path = "../orrery_persistd" }
# The served mint path (#861) owns a full iroh endpoint — docs/10-crates.md
# §13's dependency row already priced this crate for iroh and tokio.
iroh = { workspace = true }
# The issuer's Ed25519 signing key. `SessionTokenV1::sign` takes an
# `iroh_base::SecretKey`; nothing else in iroh-base is needed here.
iroh-base = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
postcard = { workspace = true }
serde = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
# The `orrery-identity` binary mirrors the coordinator's deployment contract:
# anyhow errors, a stderr tracing subscriber, and one JSON readiness line.
anyhow = { workspace = true }
serde_json = "1"
tracing-subscriber = { workspace = true }
sha2 = "0.10"
rand = "0.9"
tempfile = "3"
# Portable issuer-key escrow uses the age file format's passphrase mode. This
# deliberately delegates the KDF, authenticated encryption, and file framing
# to a reviewed construction instead of assembling cryptographic primitives
# here. Default features are empty; no SSH/plugin/CLI integrations are needed.
age = { version = "0.12.1", default-features = false }
# Interactive passphrases must not appear in argv, shell history, or `ps`.
rpassword = "7.5.4"
# Wipe temporary plaintext credential buffers when they leave scope.
zeroize = "1.9"
# FoundationDB 7.3.x (D11, D14). Optional: only built with `--features fdb`.
foundationdb = { version = "0.11", default-features = false, features = [
    "fdb-7_3",
], optional = true }

[dev-dependencies]
tokio = { workspace = true }

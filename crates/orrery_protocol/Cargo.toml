[package]
name = "orrery_protocol"
version = "0.1.0"
edition = "2021"
description = "Orrery wire and data types: CellId, intents, leases, attestations, evidence, protocol version"
license = "MIT OR Apache-2.0"

# Engine-agnostic (D15): no Bevy, no tokio. Servers, tools, and tests link it
# without an engine. Wire types are defined once, here, and every other crate
# depends on this one (docs/10-crates.md §Dependency spine).
[features]
default = ["postcard"]
# Default wire encoding (D15).
postcard = ["dep:postcard"]
# Alternative encoding, benchmarked per release (D15).
bitcode = ["dep:bitcode"]
# Extended-range CellId (D5) — wire-incompatible with the default 64-bit form.
u128-cells = []

[dependencies]
glam = { workspace = true }
iroh-base = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true, optional = true }
bytes = { workspace = true, features = ["serde"] }
bitcode = { version = "0.6", optional = true }
# Witness-set seeding (D28 clause (c)). The draw is a keyed shuffle that both
# the coordinator and every later auditor must reproduce byte for byte, so the
# primitives live beside the envelope rather than in either party's crate:
# blake3 for the seed-key commitment, HMAC-SHA256 for the seed, and ChaCha20 as
# the shuffle's stream. All three are already in this workspace's dependency
# graph (`orrery_core`, `orrery_witness`) — this crate is where the *shared*
# definition belongs, because a verifier that cannot recompute the draw cannot
# check the reveal.
blake3 = "1.8"
rand_chacha = "0.9"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
proptest = { workspace = true }

[package]
name = "orrery_sidecar"
version = "0.1.0"
edition = "2021"
description = "The synthetic-rules prediction sidecar: the shipped binary that runs canonical rules inside Lightyear's tick and registers hits"
license = "MIT OR Apache-2.0"

# A game-owned composition, not another facade plugin (#898 step 1). The facade
# cannot infer a game's predicted component, turn that component into
# `CoreState`, choose a hit radius, or say how far a weapon reaches — so the
# smallest honest game that does all four lives here, and ships as a binary
# rather than an example, because a seam reachable only from `cargo test` is
# the defect #871 was filed about.

[[bin]]
name = "orrery-sidecar"
path = "src/main.rs"

# The engine side of the crossing, with the drawing left out (#898 step 3).
# A binary rather than an example for the reason `tests/observer_kill.rs`
# needs: A9 P-4 is a claim about killing a *process*, so the test has to have
# one to kill, and `CARGO_BIN_EXE_` gives it one on every commit.
[[bin]]
name = "orrery-observer"
path = "src/bin/orrery-observer.rs"

[dependencies]
orrery = { path = "../orrery" }
orrery_authority = { path = "../orrery_authority" }
orrery_core = { path = "../orrery_core" }
# The extraction contract the shipped sidecar produces against (#898 step 3):
# the game projects its presented component onto `QuantizedTransform`, so the
# schema type is named in production, not just by the transport's tests.
orrery_ipc = { path = "../orrery_ipc" }
# The framing and the observer-side link the shipped sidecar serves onto
# (#898 step 3). Bevy-free, so the serve module is the only place the two
# vocabularies meet.
orrery_ipc_transport = { path = "../orrery_ipc_transport" }
orrery_net = { path = "../orrery_net" }
orrery_predict = { path = "../orrery_predict" }
orrery_protocol = { path = "../orrery_protocol" }
orrery_synthetic = { path = "../orrery_synthetic" }
bevy = { workspace = true }
# lightyear's replication backend calls `init_state`, which needs the
# `StateTransition` schedule `StatesPlugin` installs; `MinimalPlugins` has no
# states. A game on `DefaultPlugins` gets it for free.
bevy_state = { workspace = true }
iroh = { workspace = true }
lightyear = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# The two-endpoint fixture reaches for the real iroh endpoint the facade opens,
# to dial the other sidecar with (#898 step 4).
aeronet_iroh = { workspace = true }
bytes = { workspace = true }

[package]
name = "orrery_witness"
version = "0.1.0"
edition = "2021"
description = "Orrery passive witnessing (D10): stage-1 invariant checks, continuous log re-execution, escalation, and self-verifying discrepancy reports"
license = "MIT OR Apache-2.0"

# The engine is Bevy-free even though docs/10-crates.md lists this crate as a
# plugin. Everything here is pure — ingest signed frames, re-execute, compare,
# assemble — and the Bevy surface is a thin adapter that drains message queues.
# Keeping the logic engine-free means `orrery_persistd` and a headless bot
# harness can run the same witness the game client does, which matters because
# the P4 exit criterion is measured over bot *and* human play.
[dependencies]
orrery_core = { path = "../orrery_core" }
orrery_protocol = { path = "../orrery_protocol" }
iroh-base = { workspace = true }
blake3 = "1.8"
postcard = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The detection tests drive the whole pipeline, including the cluster end.
orrery_persistd = { path = "../orrery_persistd" }
rand_chacha = "0.9"

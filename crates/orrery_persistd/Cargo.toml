[package]
name = "orrery_persistd"
version = "0.1.0"
edition = "2021"
description = "Orrery persistence cluster harness: cell actors, segmented journal, group commit (P2 slice 2)"
license = "MIT OR Apache-2.0"

# Bevy-free (D15). Library harness for the persistence cluster (docs/10-crates.md
# §11). The default journal is the indexed wal-db-backed segmented log selected
# by D19; Fjall remains available as an explicit fallback feature.
[features]
default = ["journal-raw", "chain-grpc"]
# Journal backing store. `journal-raw` (default, D19) uses wal-db's segmented
# durable log plus Orrery's rebuilt in-memory indexes. `journal-fjall` retains
# the previous Fjall implementation as an explicit fallback. Only one may be set.
journal-fjall = ["dep:fjall"]
journal-raw = ["dep:wal-db"]
# Chain replication of the journal to one async follower (D11, RPO ≤ ~100 ms).
# Implemented in `journal::chain`; this feature is a placeholder for future
# transport options (tonic/gRPC per D12). The in-process transport is always
# available.
chain-replication = []
# Cross-process chain transport. These dependencies only provide HTTP/2 framing
# and protobuf encoding; durable storage remains in the selected journal.
chain-grpc = ["dep:hyper", "dep:hyper-util", "dep:prost", "dep:tonic"]
# FoundationDB checkpoint/restore store (slice 3). Enables `FdbCheckpointStore`
# and links the C client (`libfdb_c`). Tests that need a live cluster are
# compiled here and self-skip when no cluster is reachable.
fdb = ["dep:foundationdb"]
# Reference-only composition proof for the `persistd` binary's adjudication
# seam. This deliberately does not select the game-owned deployed artifact
# D21 reserves for an owner decision.
reference-ruleset = ["dep:orrery_conformance"]

[dependencies]
orrery_protocol = { path = "../orrery_protocol" }
# Adjudication re-runs the same verifiable core the accused peer ran (D9/D12).
orrery_core = { path = "../orrery_core" }
# Bevy-free service: the witness plugin adapter stays out of this binary.
orrery_witness = { path = "../orrery_witness", default-features = false }
# An opt-in, Bevy-free Ruleset used to exercise the binary composition seam.
# Production games link their own Ruleset through the same seam.
orrery_conformance = { path = "../orrery_conformance", optional = true }
bytes = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
blake3 = "1.8"
# The archive object format (#807 fixed it, #808 writes it). `default-features
# = false` is doing the work: the `arrow` feature is what would pull
# arrow-array/-buffer/-data/-schema, and `async` is what would pull a second
# runtime. Off, the whole addition is 20 crates (ahash, chrono, half,
# hashbrown, num-bigint/-integer/-traits, seq-macro, twox-hash and leaves) with
# no Arrow, no tokio and no compression codecs, and the low-level
# `SerializedFileWriter` is the API the archive encoder uses.
parquet = { version = "59", default-features = false }
iroh = { workspace = true }
async-trait = "0.1"
clap = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
serde_json = "1"
# The OS CSPRNG behind D27 clause (d)'s per-cell-epoch `draw_key`. A draw key
# is the one secret this crate generates, and it must come from the operating
# system rather than from a seeded PRNG: everything else in this workspace
# draws deterministically on purpose, and reaching for one of those here would
# make the required-K subset reproducible by whoever knows the seed.
getrandom = "0.3"
glam = { workspace = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
fjall = { version = "3.1", features = ["bytes_1"], optional = true }
wal-db = { version = "=1.0.0", optional = true }
# FoundationDB 7.3.x system-of-record (D11, D14). Optional: only built when the
# `fdb` feature is on (requires the C client at link time).
foundationdb = { version = "0.11", default-features = false, features = ["fdb-7_3"], optional = true }
prost = { version = "0.14.3", default-features = false, features = ["std"], optional = true }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"], optional = true }

[[bin]]
name = "persistd"
path = "src/bin/persistd.rs"
required-features = ["chain-grpc"]

[[bin]]
name = "world-census"
path = "src/bin/world-census.rs"
required-features = ["fdb"]

# D32 clause (i)'s operator-plane signer. It writes FoundationDB, but its
# authority is the operator key alone: every row it produces is re-verified by
# every `persistd` on the next poll.
[[bin]]
name = "orrery-ramp"
path = "src/bin/orrery-ramp.rs"
required-features = ["fdb"]

[[bench]]
name = "journal_latency"
harness = false

[[bench]]
name = "lease_renewal"
harness = false

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }
iroh-base = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

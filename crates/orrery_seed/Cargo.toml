[package]
name = "orrery_seed"
version = "0.1.0"
edition = "2021"
description = "Orrery offline world seeder: TOML scenario runner, deterministic seed tree, exact-N splitter, analytic dry run (P2)"
license = "MIT OR Apache-2.0"

# Bevy-free library crate plus a reference binary (D12, docs/12-world-seeding.md
# §4). Games link their own `SeedEncoder` into their own seeder binary; the
# shipped binary links the `OpaqueEncoder` sufficient for the demo, the latency
# rig and CI. v1 implements the slice the P2 demo path needs: the `uniform`
# generator, the `union` fold, and the `plan` verb (analytic dry run only —
# nothing here writes to a cluster).
[features]
default = []
# FoundationDB write path (`apply`/`verify`, gated per docs/12 §11). Mirrors
# the persistd feature posture so `plan` builds with NO C client.
fdb = ["dep:foundationdb", "orrery_persistd/fdb"]

[dependencies]
orrery_protocol = { path = "../orrery_protocol" }
# Default features per P2 decision C-6 and D19: wal-db and iroh link into the
# batch tool — a knowing deviation recorded in docs/12 §4. Only the `keyspace`
# module shapes are consumed today.
orrery_persistd = { path = "../orrery_persistd" }
toml = "1.1"
serde = { workspace = true }
serde_json = "1"
blake3 = "1.8"
rand_chacha = "0.9"
# Direct dependency on the RNG trait crate: the seed tree's ChaCha8Rng
# construction goes through `rand::SeedableRng`, and a transitive import is
# not a stable surface (D14 pinned versions are re-validated per crate).
rand = "0.9"
postcard = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
glam = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
# FoundationDB 7.3.x (D11, D14). Optional: only built with `--features fdb`
# (requires the C client at link time).
foundationdb = { version = "0.11", default-features = false, features = ["fdb-7_3"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"

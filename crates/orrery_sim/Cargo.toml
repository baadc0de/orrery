[package]
name = "orrery_sim"
version = "0.1.0"
edition = "2021"
description = "Pre-S5 C ABI spike over the headless Regolith simulation"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
orrery_core = { path = "../orrery_core" }
orrery_games = { path = "../orrery_games" }
orrery_protocol = { path = "../orrery_protocol" }

[dev-dependencies]
glam = { workspace = true }

[package]
name = "orrery_authority"
version = "0.1.0"
edition = "2021"
description = "Orrery optimistic client authority and lease state (P3)"
license = "MIT OR Apache-2.0"

[dependencies]
orrery_protocol = { path = "../orrery_protocol" }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_platform = { workspace = true }
serde = { workspace = true }
# Deterministic in-island tiebreak (D7 §4.4/§6): the same blake3 the rest of
# the workspace pins.
blake3 = "1.8"

[dev-dependencies]
# Test-only: minting valid ed25519 NodeIds for successor/handoff assertions.
iroh-base = { workspace = true }
# Test-only: the synthetic ruleset the hit validator is proven against runs
# on the real `Ruleset` contract and the real fixed-step host, so "no
# resimulation" is asserted on a step counter the executor actually drives.
orrery_core = { path = "../orrery_core" }
orrery_sim_host = { path = "../orrery_sim_host" }

[package]
name = "orrery_spatial"
version = "0.1.0"
edition = "2021"
description = "Orrery spatial model: CellId math, AOI, big_space integration, replicon visibility mapping"
license = "MIT OR Apache-2.0"

# Bevy plugin (D15). `CellId` assignment from big_space grid coordinates, the
# 27-cell AOI subscription, mapping cell membership onto bevy_replicon
# per-client visibility, high-rate interest-set selection, cell-crossing
# hysteresis, and 1-4 Hz extrapolated proxies.
[features]
# Gates integration with the big_space Bevy-0.19 port. It was a feature because
# a port delay had to degrade to manual origin management rather than block the
# workspace (docs/10-crates.md §5, D14). The port landed — big_space 0.13 builds
# against Bevy 0.19 — so the integration is on by default and the escape hatch
# stays for anyone who needs to drop it.
default = ["big_space"]
big_space = ["dep:big_space"]

[dependencies]
orrery_protocol = { path = "../orrery_protocol" }
orrery_net = { path = "../orrery_net" }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_math = { workspace = true }
bevy_reflect = { workspace = true }
bevy_time = { workspace = true }
bevy_replicon = { workspace = true }
glam = { workspace = true }
big_space = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
bevy = { workspace = true }
iroh-base = { workspace = true }
proptest = { workspace = true }
[package]
name = "orrery_ruleset_digest"
version = "0.1.0"
edition = "2021"
description = "D49 ruleset source-closure encoder used by the orrery_games build script"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1.8"
cargo_metadata = "0.23"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "orrery_coordinator"
version = "0.1.0"
edition = "2021"
description = "Orrery coordinator: coarse presence, island formation, NodeId handout (P1 stub)"
license = "MIT OR Apache-2.0"

# Bevy-free binary (D15): coarse presence tracking, island form/merge/split/
# drain, NodeId handout for island bootstrap. State is in-memory and
# reconstructible from presence announcements (docs/10-crates.md §12).
[features]
# Durable witness-seed epochs / island generation counters via FoundationDB.
# Not implemented in P1; the in-memory state is reconstructible from presence.
fdb-state = []

[[bin]]
name = "orrery-coordinator"
path = "src/bin/orrery-coordinator.rs"

[dependencies]
orrery_protocol = { path = "../orrery_protocol" }
# The standing-invalidation feed (D33 clause (e)) is an async trait, the same
# shape persistd's gateway-side seam uses.
async-trait = "0.1"
# The coordinator is a Bevy-free service that speaks iroh directly
# (docs/10-crates.md §6), so it owns an endpoint and a tokio runtime.
iroh = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
bytes = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = "1"
tracing-subscriber = { workspace = true }
# Signing interest grants: the coordinator is the only party allowed to assert
# what a peer is interested in, so it needs the ed25519 secret half (D3).
iroh-base = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
# Witness-epoch seed keys (D28 clause (c)): `k_e` is HKDF-SHA256 over a
# provisioned master secret, so a warm standby can reveal an epoch the leader
# issued. Only the derivation is here — the commitment, the seed and the draw
# live in `orrery_protocol`, because a verifier has to reproduce them.
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
glam = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
bytes = { workspace = true }
# The mint-refusal proof (`tests/standing_mint_refusal.rs`) drives
# `orrery_identity::IdentityService` over `ComputedStanding` from outside the
# identity crate — which another lane holds while #219 runs. persistd comes
# with it for the strike-row types the scorer reads.
orrery_identity = { path = "../orrery_identity" }
orrery_persistd = { path = "../orrery_persistd" }

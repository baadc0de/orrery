[package]
name = "orrery_coordinator"
version = "0.1.0"
edition = "2021"
description = "Orrery coordinator: coarse presence, island formation, NodeId handout (P1 stub)"
license = "MIT OR Apache-2.0"

# Bevy-free binary (D15): coarse presence tracking, island form/merge/split/
# drain, NodeId handout for island bootstrap. State is in-memory and
# reconstructible from presence announcements (docs/10-crates.md §12).
[features]
# Durable witness-seed epochs / island generation counters via FoundationDB.
# Not implemented in P1; the in-memory state is reconstructible from presence.
fdb-state = ["dep:orrery_persistd", "orrery_persistd/fdb"]
# D33 clause (e)'s standing-invalidation feed, read from identity's durable
# `dc` family. Enabling it only *offers* `--identity-cluster-file`; C5 still
# starts at D32's `off` posture and acts on nothing until an operator raises
# `--strikes`, so the feature is packaging and the two runtime dials are the
# gate.
#
# Not in a `default` set, and deliberately: it links `orrery_identity` and
# through it the FoundationDB C client, which the P3 island leg does not have
# and does not want (nightly.yml documents its FDB-free build as the honest
# configuration for a volatile lease store). It is instead enabled by every
# in-repo coordinator build that *does* run against a cluster — the p3-siblings
# leg in `scripts/gate-status.sh` and `.github/workflows/nightly.yml` — and
# type-checked on every commit by `scripts/check.sh`'s clippy lane.
#
# #862 box 2 found it in the state that made this necessary: no build, no CI
# job and no lint compiled it at all, so an operator could not turn the feed on
# without editing this manifest. A compile-time flag nobody sets is weaker than
# `--strikes off`, which is at least a dial on a shipped binary.
#
# Independent of `fdb-state`, which reads D32's `ramp/` posture rows through
# persistd's keyspace. Both may be on; cargo unifies the FoundationDB features
# they each imply.
#
# `dep:foundationdb` rides along for `tests/standing_invalidation_chain.rs`,
# and only for it: that suite writes through two production writers on a
# *shared* development cluster, so it has to clear the ranges it wrote or the
# next run finds an account it believes it just created already cooled down.
# There is no public range-clear helper — `orrery_persistd::fdb` exposes a
# context, a bound handle and the key builders, and nothing that erases — and
# a dev-dependency cannot be optional, so a plain one would drag the
# FoundationDB C client into the FDB-free island build `nightly.yml` documents
# as deliberate. Declared here instead, where the feature that already links
# the client is the thing that turns it on. No `src/` module names it.
standing-feed = ["dep:orrery_identity", "orrery_identity/fdb", "dep:foundationdb"]

[[bin]]
name = "orrery-coordinator"
path = "src/bin/orrery-coordinator.rs"

[dependencies]
orrery_protocol = { path = "../orrery_protocol" }
# D32's posture row vocabulary and read-only adapter are owned by persistd's
# durable keyspace. The raw journal feature only satisfies persistd's
# exactly-one-backend crate invariant; the coordinator uses no journal API and
# does not pull the chain transport.
orrery_persistd = { path = "../orrery_persistd", default-features = false, features = ["journal-raw"], optional = true }
# Optional, behind `standing-feed`: the publisher half of D33 clause (e).
# Identity owns the `d` family, so the producer lives there and this crate
# only adapts it to the local `StandingInvalidationFeed` trait. The edge runs
# coordinator → identity → persistd and never back, which is why the adapter
# is here rather than the trait impl being over there.
orrery_identity = { path = "../orrery_identity", optional = true }
# Behind `standing-feed`, and used by that feature's integration test alone —
# see the feature's own comment for why it is declared here rather than in
# `[dev-dependencies]`. Pinned to the same 0.11 / `fdb-7_3` pair every other
# member of this workspace uses (D14): two versions of the C bindings in one
# graph is a link-time failure, not a resolution one.
foundationdb = { version = "0.11", default-features = false, features = [
    "fdb-7_3",
], optional = true }
# The standing-invalidation feed (D33 clause (e)) is an async trait, the same
# shape persistd's gateway-side seam uses.
async-trait = "0.1"
# The coordinator is a Bevy-free service that speaks iroh directly
# (docs/10-crates.md §6), so it owns an endpoint and a tokio runtime.
iroh = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
bytes = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = "1"
tracing-subscriber = { workspace = true }
# Signing interest grants: the coordinator is the only party allowed to assert
# what a peer is interested in, so it needs the ed25519 secret half (D3).
iroh-base = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
# Witness-epoch seed keys (D28 clause (c)): `k_e` is HKDF-SHA256 over a
# provisioned master secret, so a warm standby can reveal an epoch the leader
# issued. Only the derivation is here — the commitment, the seed and the draw
# live in `orrery_protocol`, because a verifier has to reproduce them.
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
glam = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
bytes = { workspace = true }
# The mint-refusal proof (`tests/standing_mint_refusal.rs`) drives
# `orrery_identity::IdentityService` over `ComputedStanding` from outside the
# identity crate — which another lane holds while #219 runs. persistd comes
# with it for the strike-row types the scorer reads.
orrery_identity = { path = "../orrery_identity" }
orrery_persistd = { path = "../orrery_persistd" }
orrery_games = { path = "../orrery_games" }

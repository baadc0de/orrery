[package]
name = "orrery_games"
version = "0.1.0"
edition = "2021"
description = "Orrery's reference games: complete Ruleset implementations the trust apparatus is measured against, plus the deterministic harness that plays, replays and adjudicates them (docs/11-roadmap.md §P4)"
license = "MIT OR Apache-2.0"

# Bevy-free and headless, like `orrery_core` and `orrery_conformance`. A
# reference game is built identically on every target in the determinism
# matrix, so it takes no dependency that could differ between them: no tokio,
# no OS services, no clock.
[dependencies]
orrery_core = { path = "../orrery_core" }
orrery_protocol = { path = "../orrery_protocol" }
orrery_compose = { path = "../orrery_compose" }
# VC-6: continuous math goes through libm, never std transcendentals.
libm = "0.2"
# The harness's pilot and its sample-loss model are seeded ChaCha8 — harness
# code, not core rules, but deterministic for the same reason.
rand_chacha = "0.9"
rand_core = "0.9"
# The chain digest over per-tick state hashes.
blake3 = "1.8"
# F-4 class D-4's cross-replay leg signs with the same transport identity the
# production authority path uses (D3): `InputLogProducer` takes an
# `iroh_base::SecretKey`, so building the evidence a witness adjudicates needs
# one here. Key material is a fixed constant, never generated — no OS entropy,
# no clock, nothing that could differ across the determinism matrix.
iroh-base = { workspace = true }
# F-4 class D-3 frames at-rest component slots exactly as
# `orrery_persistd::schema::ComponentBag` does, and encodes the journal records
# a `feed_uplink`-shaped producer would queue. Same encoder, same bytes.
bytes = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }

[build-dependencies]
# D49's build identity is generated while this crate compiles. The encoder
# obtains the source closure from Cargo metadata, rather than maintaining it
# beside this manifest.
orrery_ruleset_digest = { path = "../orrery_ruleset_digest" }

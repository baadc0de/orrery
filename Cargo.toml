[workspace]
resolver = "3"
members = [
    "vendor/aeronet_iroh",
    "vendor/aeronet_tokio_runtime",
    "vendor/bevy_replicon",
    "crates/orrery_protocol",
    "crates/orrery_core",
    "crates/orrery_witness",
    "crates/orrery_net",
    "crates/orrery_spatial",
    "crates/orrery_coordinator",
    "crates/orrery_predict",
    "crates/orrery_authority",
    "crates/orrery_persist_client",
    "crates/orrery_persistd",
    "crates/orrery_seed",
    "crates/orrery_conformance",
]

# The P2 latency rig and gate are standalone tools (the p0-nat-test /
# p0-dashboard precedent): each carries its own `[workspace]` table so it
# builds against its own lockfile and does not inherit this workspace's
# members, while still path-depending on `orrery_protocol` and
# `orrery_persist_client`. Excluded here so a workspace-level command does
# not try to build them as members.
exclude = [
    "p0-nat-test",
    "p0-dashboard",
    "p2-load",
    "p2-dashboard",
]

# Pinned versions per D14 (docs/adr/0014-pinned-versions.md), ecosystem as of Aug 2026.
# Re-validate when implementation of each dependent crate starts; don't bump
# casually.
[workspace.dependencies]
# Bevy
bevy = "0.19"
bevy_app = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false }
bevy_math = { version = "0.19", default-features = false }
bevy_platform = { version = "0.19", default-features = false }
bevy_reflect = { version = "0.19", default-features = false }
bevy_time = { version = "0.19", default-features = false }

# Netcode stack (D4)
aeronet_io = "0.21"
# `aeronet_iroh` / `aeronet_tokio_runtime` are not published on crates.io as
# of Aug 2026; vendored under vendor/ until the upstreaming PR lands.
aeronet_iroh = { path = "vendor/aeronet_iroh", version = "0.21.0" }
aeronet_tokio_runtime = { path = "vendor/aeronet_tokio_runtime", version = "0.21.0" }
iroh = "1.0.3"
# Identity / signature types for `orrery_protocol` (D3: iroh ed25519 key =
# transport identity). `key` enables `PublicKey`/`EndpointId` + `Signature`.
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }

# Protocol encoding (D15: postcard default). `use-std` enables `to_stdvec`/
# `from_bytes`, used by the protocol crate's roundtrip tests.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
glam = { version = "0.32", features = ["serde"] }

# Replication stack (P1, D4): bevy_replicon 0.42 visibility mapping.
# Vendored under vendor/bevy_replicon to surface the change-detection
# internals (`server::uplink`) that feed the persistence uplink (D11);
# upstreaming intent is a PR against simgine/bevy_replicon.
bevy_replicon = { path = "vendor/bevy_replicon", version = "0.42.1" }
# big_space 0.13 (Bevy 0.19) is not yet on crates.io; the WIP `bevy-0.19`
# branch is the tracked P1 risk (docs/11-roadmap.md §P1). Pinned to the branch
# commit so the workspace builds reproducibly; swap to the crates.io release
# when it lands.
big_space = { git = "https://github.com/aevyrie/big_space", branch = "bevy-0.19" }

# Async / utility
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
hyper = "1.11.0"
hyper-util = { version = "0.1.20", features = ["client-legacy", "server-auto", "tokio"] }
tracing = "0.1"
derive_more = { version = "2", default-features = false }
wasm-bindgen-futures = "0.4"

# Dev / test
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
proptest = "1.11"
anyhow = "1"

# Lint config mirrored from the upstream aeronet workspace so the vendored
# crates stay upstream-clean.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
similar_names = "allow"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
unwrap_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(docsrs_aeronet)"] }

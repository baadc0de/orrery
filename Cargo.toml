[workspace]
resolver = "3"
members = [
    "vendor/aeronet_iroh",
    "vendor/aeronet_tokio_runtime",
    "vendor/bevy_replicon",
    "crates/orrery_protocol",
    "crates/orrery_core",
    "crates/orrery_witness",
    "crates/orrery_net",
    "crates/orrery_spatial",
    "crates/orrery_coordinator",
    "crates/orrery_predict",
    "crates/orrery_authority",
    "crates/orrery_persist_client",
    "crates/orrery_persistd",
    # D12's first service row. A root member, not a ninth workspace: the
    # eight-workspace table in AGENTS.md and `check.sh --self-test` police that.
    "crates/orrery_identity",
    "crates/orrery_seed",
    "crates/orrery_games",
    "crates/orrery_ruleset_digest",
    "crates/orrery_compose",
    "crates/orrery_conformance",
    # Pre-S5 C ABI spike: proves the engine-neutral simulation boundary.
    "crates/orrery_sim",
    "crates/orrery_sim_host",
    # The facade sits on top of the spine: it depends on every client plugin.
    "crates/orrery",
]

# The P2 latency rig and gate are standalone tools (the gates/p0-nat-test /
# gates/p0-dashboard precedent): each carries its own `[workspace]` table so it
# builds against its own lockfile and does not inherit this workspace's
# members, while still path-depending on `orrery_protocol` and
# `orrery_persist_client`. Excluded here so a workspace-level command does
# not try to build them as members.
#
# This list is documentation, not mechanism. `members` above is explicit —
# no globs — and each tool declares its own `[workspace]`, either of which is
# already enough to keep cargo from adopting it. `gates/p4-streams-bench` went four
# months absent from this list with no consequence at all, which is the proof:
# its omission was cosmetic, not a bug. It is listed now so that the seven
# standalone tools read the same here as they do in `scripts/check.sh`'s lane
# table, which is the list that actually governs what gets checked — and whose
# `--self-test` holds itself against the filesystem rather than against this
# file.
exclude = [
    "gates/p0-nat-test",
    "gates/p0-dashboard",
    "gates/p2-load",
    "gates/p2-dashboard",
    "gates/p3-island",
    "gates/p1-swarm",
    "gates/p4-streams-bench",
]

# Pinned versions per D14 (docs/adr/0014-pinned-versions.md), ecosystem as of Aug 2026.
# Re-validate when implementation of each dependent crate starts; don't bump
# casually.
[workspace.dependencies]
# Bevy
bevy = "0.19"
bevy_app = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false }
bevy_math = { version = "0.19", default-features = false }
bevy_platform = { version = "0.19", default-features = false }
bevy_reflect = { version = "0.19", default-features = false }
bevy_state = { version = "0.19", default-features = false }
bevy_time = { version = "0.19", default-features = false }

# Netcode stack (D4)
aeronet_io = "0.21"
# `aeronet_iroh` / `aeronet_tokio_runtime` are not published on crates.io as
# of Aug 2026; vendored under vendor/ until the upstreaming PR lands.
aeronet_iroh = { path = "vendor/aeronet_iroh", version = "0.21.0" }
aeronet_tokio_runtime = { path = "vendor/aeronet_tokio_runtime", version = "0.21.0" }
iroh = "1.0.3"
# Identity / signature types for `orrery_protocol` (D3: iroh ed25519 key =
# transport identity). `key` enables `PublicKey`/`EndpointId` + `Signature`.
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }

# Protocol encoding (D15: postcard default). `use-std` enables `to_stdvec`/
# `from_bytes`, used by the protocol crate's roundtrip tests.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
glam = { version = "0.32", features = ["serde"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }

# Replication stack (P1, D4): bevy_replicon 0.42 visibility mapping.
# Vendored under vendor/bevy_replicon to surface the change-detection
# internals (`server::uplink`) that feed the persistence uplink (D11);
# upstreaming intent is a PR against simgine/bevy_replicon.
bevy_replicon = { path = "vendor/bevy_replicon", version = "0.42.1" }
# lightyear 0.29 (D4, D14): prediction, rollback and snapshot interpolation,
# configured by `orrery_predict` and named nowhere else (docs/10-crates.md §7).
# Default features minus the transports — Orrery's link is aeronet+iroh
# (`orrery_net`), so none of lightyear's own IO backends are compiled in.
lightyear = { version = "0.29", default-features = false, features = [
    "std",
    "client",
    "server",
    "replication",
    "prediction",
    "interpolation",
    "input_native",
] }

# big_space 0.13 (Bevy 0.19) is not yet on crates.io; the WIP `bevy-0.19`
# branch is the tracked P1 risk (docs/11-roadmap.md §P1). Pinned to the branch
# commit so the workspace builds reproducibly; swap to the crates.io release
# when it lands.
big_space = { git = "https://github.com/aevyrie/big_space", branch = "bevy-0.19" }

# Async / utility
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
hyper = "1.11.0"
hyper-util = { version = "0.1.20", features = ["client-legacy", "server-auto", "tokio"] }
tracing = "0.1"
derive_more = { version = "2", default-features = false }
wasm-bindgen-futures = "0.4"

# Dev / test
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
proptest = "1.11"
anyhow = "1"

# Lint config mirrored from the upstream aeronet workspace so the vendored
# crates stay upstream-clean.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
similar_names = "allow"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
unwrap_used = "warn"

# lightyear's replication and prediction crates depend on `bevy_replicon` from
# crates.io, and Orrery depends on the vendored fork. Without this patch cargo
# resolves *both*, and two copies of replicon are two distinct `Replicated`
# component types: `orrery_spatial`'s visibility mapping and lightyear's
# replication would silently talk past each other rather than fail to compile.
# The patch collapses them onto the fork, which is 0.42.1 plus the
# `server::uplink` change-detection exposure (D11) — a superset, so it satisfies
# lightyear's `^0.42.1` requirement.
[patch.crates-io]
bevy_replicon = { path = "vendor/bevy_replicon" }

# D43 (f)(2): the canonical crates' build pins `overflow-checks = false`
# uniformly across profiles. Cargo's default splits dev (panic) from release
# (wrap), and that *profile-dependence* is the hazard the clause closes --
# the same stray operation must not behave one way in a test and another in
# a shipped client. `overflow-checks = true` is unavailable here: it means
# panic, which (f)(1) bars outright.
#
# This does not license plain arithmetic. Canonical code still uses the
# explicit-semantics operations that set the overflow flag (f)(3); the pin
# only turns an operation the review missed from a cross-profile divergence
# into an ordinary defect. `test` inherits `dev` and `bench` inherits
# `release`, so these two entries cover all four profiles.
[profile.dev]
overflow-checks = false

[profile.release]
overflow-checks = false

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(docsrs_aeronet)"] }

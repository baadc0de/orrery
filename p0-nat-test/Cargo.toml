[package]
name = "p0-nat-test"
version = "0.1.0"
edition = "2021"
description = "P0 transport spike: standalone NAT hole-punching test tool for Orrery's iroh-based transport"
license = "MIT OR Apache-2.0"

[[bin]]
name = "p0-nat-test"
path = "src/main.rs"

[dependencies]
iroh = "1.0.3"
bytes = "1"
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# /etc/nginx/sites-available/campaigns, tracked in the repository by the
# owner decision of 2026-09-03 (issue #1002): the settings that make banking
# work must survive a host rebuild, and one of them already failed to.
#
# The load-bearing line is the client_max_body_size 64m below. nginx's
# default is 1 MiB; a 3.5-minute telemetry session is about 2 MB; without
# the directive every volunteer upload was refused with HTTP 413 before
# admission saw the request, #735's refusal logging never fired, and
# sessions were recorded and thrown away for an unknown length of time.
#
# The limit is tied to the application's own ceiling: MAX_UPLOAD_BYTES in
# scripts/admission.py (64 * 1024**2, i.e. 64 MiB). The two must stay equal.
# scripts/deploy-web-tier.sh refuses to install a site where they do not,
# and its --self-test (run per-commit in the gates lane) fails when this
# file's limit and that constant drift apart in either direction. Change
# MAX_UPLOAD_BYTES first, then this line, in the same commit.
#
# What was recorded from the live host on 2026-09-03 is here: two server
# blocks, both server_name campaigns.distopik.com -- this TLS listener
# proxying to admission on 127.0.0.1:8080, and a port-80 redirect -- with
# client_max_body_size 64m in both. What was NOT recorded is left as an
# ORRERY_PLACEHOLDER marker rather than guessed, because a file that looks
# right and is wrong is worse than one that is obviously incomplete:
#   - the TLS listen directive (the live form was not captured; it may
#     carry options this file must not invent)
#   - the certificate paths (certbot-managed; the arrangement is §10.1 of
#     docs/plans/campaign-admission-service.md)
#   - the exact port-80 redirect directive
# deploy-web-tier.sh refuses to install while any marker remains; fill
# them from the live host, commit, and deploy.

server {
    listen ORRERY_PLACEHOLDER_TLS_LISTEN;
    server_name campaigns.distopik.com;

    ssl_certificate ORRERY_PLACEHOLDER_TLS_CERT_PATH;
    ssl_certificate_key ORRERY_PLACEHOLDER_TLS_CERT_KEY_PATH;

    # Keep equal to MAX_UPLOAD_BYTES in scripts/admission.py (64 MiB). This
    # block is the one that must carry the directive: without it the server
    # inherits nginx's 1 MiB default and refuses every telemetry upload with
    # 413 before admission sees the request (#1002).
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}

# The port-80 redirect block. Its role, its listen port and its server_name
# were recorded; the redirect itself is a placeholder, not a guess at the
# live directive.
server {
    listen 80;
    server_name campaigns.distopik.com;

    ORRERY_PLACEHOLDER_PORT80_REDIRECT;

    # Present on the live host in both blocks. A redirect serves no request
    # bodies, but the tracked file stays byte-comparable to the host's.
    client_max_body_size 64m;
}

server {
    server_name campaigns.distopik.com;
    # Keep equal to MAX_UPLOAD_BYTES in scripts/admission.py (64 MiB).
    # Without it nginx's 1 MiB default silently refuses every volunteer
    # telemetry upload with 413 before admission sees the request (#1002).
    client_max_body_size 64m;
    location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300s; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/campaigns.distopik.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/campaigns.distopik.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = campaigns.distopik.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name campaigns.distopik.com;
    # Keep equal to MAX_UPLOAD_BYTES in scripts/admission.py (64 MiB).
    # Without it nginx's 1 MiB default silently refuses every volunteer
    # telemetry upload with 413 before admission sees the request (#1002).
    client_max_body_size 64m;
    return 404; # managed by Certbot


}